openapi: 3.1.0
info:
  title: Firmivra client portal auth API
  version: 0.1.0
  description: |
    Client portal sign-up, verification and sign-in (`portal.firmivra.com/{firmSlug}`), and the
    firm's queue of pending sign-ups. Design: docs/AUTH-DESIGN.md (clients pool). Staff and
    Super Admin sign-in: docs/api/auth.yaml, whose sign-in bodies and results these reuse.

    **Source of truth:** the zod schemas in `packages/types/src/client-auth/schemas.ts`, with typed
    calls in `createPortalAuthClient` and `createClientSignUpsClient` (web: `portalAuth(slug)` in
    `apps/web/src/lib/auth.ts`, `api.clientSignUps` in `apps/web/src/lib/api.ts`). Fixtures for
    mock mode: `apps/web/src/mocks/client-auth.ts`. If this file and the zod schemas differ, the
    zod schemas win.

    ## Pages and calls

    | Page | Calls |
    | --- | --- |
    | `/{firm}` (layout and landing) | `GET info` |
    | `/{firm}/sign-up` | `GET info`, `GET legal/{kind}`, `POST auth/sign-up` |
    | `/{firm}/sign-up/verify-email` | `GET auth/sign-up`, `POST .../verify-email`, `.../resend`, `.../change-email` |
    | `/{firm}/sign-up/verify-phone` | `GET auth/sign-up`, `POST .../verify-phone`, `.../resend`, `.../change-phone` |
    | `/{firm}/sign-up/done` | `GET auth/sign-up` (just signed up) or `GET me` (a pending client who signed in) |
    | `/{firm}/sign-in`, `/forgot-password`, `/reset-password` | `POST auth/sign-in`, `auth/mfa`, `auth/forgot-password`, `auth/reset-password` |

    - **Sign-up session in a cookie.** The pages store nothing. `POST auth/sign-up` sets the sealed
      sign-up cookie; every sign-up call answers a `SignUpState` read from it (step, email, masked
      phone, when Resend works again). Each page starts with `GET auth/sign-up` and goes where
      `step` says. `410 SIGN_UP_EXPIRED` (no cookie, or older than 30 minutes): back to
      `/{firm}/sign-up`.
    - **Order:** verify the email, then the phone (`409 WRONG_STEP` otherwise). Change Email and
      Change Phone work until that item is verified (`409 ALREADY_VERIFIED`). Resend works from
      `resendAvailableAt` (`429 RATE_LIMITED` before): the 45 s gap, or later when this IP or
      network is at its hourly limit, or the sign-up's end when the session has used its 10
      requests (then sign up again: the sign-up resumes, see below).
    - **Changed email or phone.** The 45 s gap counts from the sign-up session's last request
      (sign-up, resend, a change, or the SMS sent after verify-email), whatever its address, and is
      kept on the server (an older cookie resets nothing). Every change starts the gap again. A
      change inside the gap sends nothing yet (no code, no notice), and the code sent to the old
      address stops working: show the countdown from `resendAvailableAt`, then Resend.
    - **Never reveals an account.** Sign-up answers the same for an email that already has an
      account at this firm: the same answers, the same cookie and the same timing. That person
      gets an email saying so (at most one an hour) instead of a code, and the codes never match.
      Signing up again over a sign-up nobody finished (no verified phone yet, also one stopped
      after its email step) is allowed; the new attempt gets the account only by verifying the
      email with its own code, then goes on to the phone. So a closed tab or a refused SMS never
      strands a sign-up. Sign-in, forgot and reset password answer as in auth.yaml.
    - **After verify-phone** the account waits for the firm (`PENDING_APPROVAL`). A pending client
      can sign in; `GET me` shows `clientAccounts[0].status: PENDING_APPROVAL`, and the portal
      layout sends them to `/{firm}/sign-up/done`. A declined or disabled client, or one who has
      not verified both email and phone, gets `401 INVALID_CREDENTIALS` at sign-in, exactly like
      a wrong password.
    - **MFA is optional** for clients: sign-in usually answers `SIGNED_IN` straight away;
      `MFA_REQUIRED` only for clients who turned it on.

    ## Cookies

    One portal host serves every firm, and a client has a separate login per firm, so each firm
    has its own cookies (`HttpOnly`, `Secure`, host-only; `portalCookies(slug)` in the zod file):

    | Cookie | Name | Path | Lifetime | SameSite |
    | --- | --- | --- | --- | --- |
    | access | `fv_portal_{slug}_access` | `/api/v1/portal/{slug}/` | 15 min | Lax |
    | id | `fv_portal_{slug}_id` | `/api/v1/portal/{slug}/` | 15 min | Lax |
    | refresh | `fv_portal_{slug}_refresh` | `/api/v1/portal/{slug}/auth` | 30 days | Strict |
    | sign-up | `fv_portal_{slug}_signup` | `/api/v1/portal/{slug}/auth/sign-up` | 30 min | Strict |

    **Changes come only from the browser.** Every POST sends JSON from the site's own pages
    (`415 UNSUPPORTED_MEDIA_TYPE` otherwise, for example an HTML form; `403 ORIGIN_NOT_ALLOWED`
    for another origin, or a call with a portal cookie but no `Origin`). Server-side code (Next.js
    server components, route handlers, server actions) only reads; see "Calling the API from the
    web app" in auth.yaml.

    One firm's cookies never reach another firm's routes: on another firm's portal the visitor is
    simply signed out. They never reach page requests either, so portal pages read the session in
    the browser (`GET me`), not on the server. Bodies are JSON and come from the portal's own
    origin (see "Calling the API from the web app" in auth.yaml).

    ## Firm side

    `GET /client-sign-ups` lists verified sign-ups waiting for the firm (or declined ones), oldest
    first, for the owner and admins (`x-business-id` selects the firm). Approve creates the firm's
    client record and opens the portal; decline closes the login. The client gets an email either
    way. Both take only a sign-up in the queue (404 for anything else, such as one that never
    verified both email and phone); one already approved or declined is `409 NOT_PENDING`, so of
    two staff acting at once only one changes it.

    **Linking an existing client record.** Approve with `clientId` links the login to a record the
    firm already has (added by staff, or from Begin Online) instead of creating a duplicate. That
    login then sees the record's tax files, so approve links only if the record's email is the
    sign-up's verified email (both lower-cased), the record has no primary portal login yet, and it
    is not archived (restore it first). Otherwise it answers `409 CLIENT_NOT_LINKABLE` and changes
    nothing (`404` if the firm has no such record). `existingClient` in the list shows only a
    record that passes this check; offer linking only for that one.

    **Never a second client with one email.** Approve without `clientId` answers
    `409 DUPLICATE_EMAIL` when a client of the firm already has the sign-up's email (the code the
    client records API uses), so staff link that record. If that record cannot be linked (it
    already has a portal login), the sign-up cannot be approved as it is: decline it, or correct
    the record first. Approve takes the same per-firm email lock as the client records API, so a
    client created at the same moment with that email never makes a second record. A new record
    gets an empty profile, as R10's create makes.

    **The queue is audited and strict.** Listing writes `client_sign_ups.listed` (the count only:
    it returns names, emails and phones). The list query and the decline body refuse unknown
    fields, and the decline reason is plain text (line breaks allowed, no other control
    characters). If the approval or decline email fails, the change still stands (the email is
    retried by R6).

    ## Local development

    With `AUTH_MODE=local`, every verification code is `000000` and nothing is sent. The sign-in
    password and MFA code are as in auth.yaml.

    ## Rate limits

    `sign-up`, `verify-email`, `verify-phone`, `resend`, `change-email`, `change-phone`, and the
    sign-in calls answer `429 RATE_LIMITED` when called too often (per viewer IP and per email):
    - at most 5 sign-ups (or changes to that email) for one email from one network at a firm in a
      day (a person elsewhere is never blocked by them);
    - at most 10 requests (sign-up, resend, changes, the SMS after verify-email) in one sign-up
      session;
    - at most 10 of those requests from one IP address, and 50 from one network (/24 or /48), in an
      hour, across every firm.

    The answer is the same for every limit and every email: "Too many attempts. Please try again
    later." (some limits last a day). Each limit is counted and recorded in one database
    transaction under a lock that is never waited for: a request that arrives while another for the
    same network, email or sign-up session is being counted gets the same 429 at once, so parallel
    requests cannot pass a limit together and a burst never ties up the database. A busy database
    answers `503 SERVICE_BUSY` with `Retry-After` (auth.yaml). Neither a person's nor a firm's
    sign-up closes for volume: 20 sign-ups for one email, or 200 at a firm, in a day only raise an
    alert (once a day). Codes to one address, for one account, and a firm's SMS codes (200 a day)
    are capped; above a cap nothing is sent and the answer stays the same. The SMS after
    verify-email is not held to the session's own 10 requests; when it is over the IP or network
    limit, verify-email still succeeds and the code waits for Resend (`resendAvailableAt` says
    when). At most one "already registered" email goes to an account an hour, also under parallel
    sign-ups.

servers:
  - url: /api/v1
    description: Same host as the site.

tags:
  - name: portal
    description: Public portal reads.
  - name: sign-up
  - name: sign-in
    description: Same bodies and results as /auth in auth.yaml.
  - name: sign-ups
    description: Firm site, owner and admin.

paths:
  /portal/{firmSlug}/info:
    get:
      tags: [portal]
      operationId: portalInfo
      summary: The firm's portal name, branding, sign-up state and legal versions
      parameters: [{ $ref: '#/components/parameters/FirmSlug' }]
      responses:
        '200':
          description: For the portal layout and the landing page
          content: { application/json: { schema: { $ref: '#/components/schemas/PortalInfo' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /portal/{firmSlug}/legal/{kind}:
    get:
      tags: [portal]
      operationId: portalLegal
      summary: The current Terms of Service or Privacy Policy (Markdown)
      parameters:
        - { $ref: '#/components/parameters/FirmSlug' }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [terms, privacy] } }
      responses:
        '200':
          description: The current version
          content: { application/json: { schema: { $ref: '#/components/schemas/LegalDocument' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /portal/{firmSlug}/auth/sign-up:
    parameters: [{ $ref: '#/components/parameters/FirmSlug' }]
    post:
      tags: [sign-up]
      operationId: signUp
      summary: Create the account and send the email code ("Create Your Account")
      description: |
        Sets the sign-up cookie. `accepted` must hold the current Terms and Privacy versions from
        `info`. The answer is the same whether or not the email already has an account here.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SignUpRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/SignUpState' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403':
          description: '`SIGN_UP_CLOSED` (the firm takes no sign-ups now) or `ORIGIN_NOT_ALLOWED` (not sent from the site''s own pages)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`TERMS_OUTDATED`: reload `info` and show the current versions'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [sign-up]
      operationId: signUpState
      summary: Where the sign-up stands (each sign-up page starts here)
      responses:
        '200': { $ref: '#/components/responses/SignUpState' }
        '410': { $ref: '#/components/responses/SignUpExpired' }

  /portal/{firmSlug}/auth/sign-up/verify-email:
    parameters: [{ $ref: '#/components/parameters/FirmSlug' }]
    post:
      tags: [sign-up]
      operationId: verifyEmail
      summary: Check the 6-digit email code
      requestBody: { $ref: '#/components/requestBodies/VerifyCode' }
      responses:
        '200': { $ref: '#/components/responses/SignUpState' }
        '400': { $ref: '#/components/responses/CodeInvalid' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '409': { $ref: '#/components/responses/WrongStep' }
        '410': { $ref: '#/components/responses/SignUpExpired' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /portal/{firmSlug}/auth/sign-up/verify-phone:
    parameters: [{ $ref: '#/components/parameters/FirmSlug' }]
    post:
      tags: [sign-up]
      operationId: verifyPhone
      summary: Check the 6-digit SMS code; the account then waits for the firm
      requestBody: { $ref: '#/components/requestBodies/VerifyCode' }
      responses:
        '200': { $ref: '#/components/responses/SignUpState' }
        '400': { $ref: '#/components/responses/CodeInvalid' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '409': { $ref: '#/components/responses/WrongStep' }
        '410': { $ref: '#/components/responses/SignUpExpired' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /portal/{firmSlug}/auth/sign-up/resend:
    parameters: [{ $ref: '#/components/parameters/FirmSlug' }]
    post:
      tags: [sign-up]
      operationId: resendCode
      summary: Send a new email or SMS code ("Resend Code")
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResendCodeRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/SignUpState' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '409': { $ref: '#/components/responses/AlreadyVerified' }
        '410': { $ref: '#/components/responses/SignUpExpired' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /portal/{firmSlug}/auth/sign-up/change-email:
    parameters: [{ $ref: '#/components/parameters/FirmSlug' }]
    post:
      tags: [sign-up]
      operationId: changeEmail
      summary: Use another email and send a new code ("Change Email Address")
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ChangeEmailRequest' } }
      responses:
        '200': { $ref: '#/components/responses/SignUpState' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '409': { $ref: '#/components/responses/AlreadyVerified' }
        '410': { $ref: '#/components/responses/SignUpExpired' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /portal/{firmSlug}/auth/sign-up/change-phone:
    parameters: [{ $ref: '#/components/parameters/FirmSlug' }]
    post:
      tags: [sign-up]
      operationId: changePhone
      summary: Use another phone number and send a new SMS code ("Change Phone Number")
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ChangePhoneRequest' } }
      responses:
        '200': { $ref: '#/components/responses/SignUpState' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '409': { $ref: '#/components/responses/AlreadyVerified' }
        '410': { $ref: '#/components/responses/SignUpExpired' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /portal/{firmSlug}/auth/sign-in:
    parameters: [{ $ref: '#/components/parameters/FirmSlug' }]
    post:
      tags: [sign-in]
      operationId: portalSignIn
      summary: Sign in to this firm's portal
      description: |
        As `/auth/sign-in` in auth.yaml, with the firm's own login. `SIGNED_IN` sets the firm's
        portal cookies, and `me.clientAccounts` holds only this firm's account. A declined or
        disabled client, or a sign-up that never verified email and phone, gets
        `401 INVALID_CREDENTIALS`, the same as a wrong password or an unknown email.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: './auth.yaml#/components/schemas/SignInRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/SignInResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /portal/{firmSlug}/auth/mfa:
    parameters: [{ $ref: '#/components/parameters/FirmSlug' }]
    post:
      tags: [sign-in]
      operationId: portalMfa
      summary: The authenticator code, for clients who turned MFA on
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: './auth.yaml#/components/schemas/MfaRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/SignInResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /portal/{firmSlug}/auth/mfa/setup:
    parameters: [{ $ref: '#/components/parameters/FirmSlug' }]
    post:
      tags: [sign-in]
      operationId: portalMfaSetup
      summary: First-time authenticator setup, as in auth.yaml
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: './auth.yaml#/components/schemas/MfaSetupRequest' } } }
      responses:
        '200':
          description: The key to add to the authenticator app, and a new session
          content: { application/json: { schema: { $ref: './auth.yaml#/components/schemas/MfaSetupResponse' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /portal/{firmSlug}/auth/refresh:
    parameters: [{ $ref: '#/components/parameters/FirmSlug' }]
    post:
      tags: [sign-in]
      operationId: portalRefresh
      summary: Renew the access cookie, as in auth.yaml
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /portal/{firmSlug}/auth/sign-out:
    parameters: [{ $ref: '#/components/parameters/FirmSlug' }]
    post:
      tags: [sign-in]
      operationId: portalSignOut
      summary: Sign out of this firm's portal; always succeeds
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: './auth.yaml#/components/schemas/SignOutRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /portal/{firmSlug}/auth/forgot-password:
    parameters: [{ $ref: '#/components/parameters/FirmSlug' }]
    post:
      tags: [sign-in]
      operationId: portalForgotPassword
      summary: Email a reset code; the same answer whether or not the account exists
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: './auth.yaml#/components/schemas/ForgotPasswordRequest' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /portal/{firmSlug}/auth/reset-password:
    parameters: [{ $ref: '#/components/parameters/FirmSlug' }]
    post:
      tags: [sign-in]
      operationId: portalResetPassword
      summary: Set a new password with the emailed code, as in auth.yaml
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: './auth.yaml#/components/schemas/ResetPasswordRequest' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400':
          description: '`VALIDATION_FAILED` or `RESET_CODE_INVALID` (as in auth.yaml)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /portal/{firmSlug}/me:
    get:
      tags: [sign-in]
      operationId: portalMe
      summary: The signed-in client of this firm
      description: |
        `clientAccounts` holds this firm's account. Status `PENDING_APPROVAL`: show
        `/{firm}/sign-up/done`. Status `ACTIVE`: the portal. `401` without this firm's session,
        or once the client may no longer sign in (for example declined).
      parameters: [{ $ref: '#/components/parameters/FirmSlug' }]
      security: [{ portalCookie: [] }]
      responses:
        '200':
          description: The client and their account at this firm
          content: { application/json: { schema: { $ref: './auth.yaml#/components/schemas/MeResponse' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /client-sign-ups:
    get:
      tags: [sign-ups]
      operationId: listClientSignUps
      summary: Verified sign-ups waiting for the firm (or declined), oldest first
      security: [{ firmCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING_APPROVAL, DECLINED], default: PENDING_APPROVAL }
        - { name: cursor, in: query, schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: One page
          content: { application/json: { schema: { $ref: '#/components/schemas/ClientSignUpList' } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /client-sign-ups/{clientAccountId}/approve:
    post:
      tags: [sign-ups]
      operationId: approveClientSignUp
      summary: Approve; creates the client record (or links an existing one) and opens the portal
      description: |
        Without a body it creates the firm's client record from the sign-up, or answers
        `409 DUPLICATE_EMAIL` when a client of the firm already has that email. With `clientId`
        (for example `existingClient` from the list) it links the login to that record instead, so
        the firm gets no duplicate, but only if the record's email is the sign-up's verified email
        (both lower-cased) and the record has no primary portal login yet. Otherwise
        `409 CLIENT_NOT_LINKABLE` and nothing changes; `404` if the firm has no such record. Any
        other body field is `400 VALIDATION_FAILED`.
      security: [{ firmCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - { $ref: '#/components/parameters/ClientAccountId' }
      requestBody:
        required: false
        content:
          application/json: { schema: { $ref: '#/components/schemas/ApproveSignUpRequest' } }
      responses:
        '200':
          description: Approved; the client gets an email
          content:
            application/json: { schema: { $ref: '#/components/schemas/ApproveSignUpResponse' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`FORBIDDEN` (only the owner and admins) or `ORIGIN_NOT_ALLOWED` (not sent from the site''s own pages)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `NOT_PENDING` (someone already approved or declined it), `CLIENT_NOT_LINKABLE` (the
            record's email is not the sign-up's verified email, or the record already has a
            primary portal login) or `DUPLICATE_EMAIL` (no `clientId`, but a client of the firm
            already has this email)
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /client-sign-ups/{clientAccountId}/decline:
    post:
      tags: [sign-ups]
      operationId: declineClientSignUp
      summary: Decline, with an optional reason; the login is closed
      description: |
        The client can no longer sign in, and any session they had ends. The reason stays with the
        firm (`declineReason` in the declined list); the client's email does not include it.
      security: [{ firmCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - { $ref: '#/components/parameters/ClientAccountId' }
      requestBody:
        required: false
        content:
          application/json: { schema: { $ref: '#/components/schemas/DeclineSignUpRequest' } }
      responses:
        '200':
          description: Declined; the client gets an email
          content:
            application/json: { schema: { $ref: '#/components/schemas/DeclineSignUpResponse' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`FORBIDDEN` (only the owner and admins) or `ORIGIN_NOT_ALLOWED` (not sent from the site''s own pages)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NotPending' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

components:
  parameters:
    FirmSlug:
      name: firmSlug
      in: path
      required: true
      description: The firm's portal slug, for example `lvp` (any letter case).
      schema: { type: string }
    ClientAccountId:
      name: clientAccountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BusinessId:
      name: x-business-id
      in: header
      required: false
      description: The firm to act in, for staff with more than one firm; checked against an ACTIVE membership (404 otherwise).
      schema: { type: string, format: uuid }

  requestBodies:
    VerifyCode:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/VerifyCodeRequest' } } }

  securitySchemes:
    portalCookie:
      type: apiKey
      in: cookie
      name: fv_portal_{slug}_access
      description: The firm's portal access cookie (see Cookies).
    firmCookie: { type: apiKey, in: cookie, name: fv_access }

  responses:
    SignUpState:
      description: Where the sign-up stands
      content: { application/json: { schema: { $ref: '#/components/schemas/SignUpState' } } }
    SignInResult:
      description: Next step, or `SIGNED_IN` with the portal cookies set
      content: { application/json: { schema: { $ref: './auth.yaml#/components/schemas/SignInResult' } } }
    Ok:
      description: Done
      content: { application/json: { schema: { $ref: './auth.yaml#/components/schemas/Ok' } } }
    ValidationFailed:
      description: '`VALIDATION_FAILED`: field errors in `details`'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Unauthenticated:
      description: '`INVALID_CREDENTIALS`, `MFA_CODE_INVALID`, `CHALLENGE_EXPIRED` or `UNAUTHENTICATED`, as in auth.yaml'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Forbidden:
      description: '`FORBIDDEN`: only the owner and admins handle sign-ups'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    NotFound:
      description: '`NOT_FOUND`: unknown or inactive firm, or a sign-up of another firm'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    RateLimited:
      description: '`RATE_LIMITED`: too many attempts'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    CodeInvalid:
      description: '`CODE_INVALID`: wrong or expired code; stay on the page'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    WrongStep:
      description: '`WRONG_STEP`: follow `step` from the last answer'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    AlreadyVerified:
      description: '`ALREADY_VERIFIED`: that item is verified already'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    SignUpExpired:
      description: '`SIGN_UP_EXPIRED`: no sign-up in progress; back to /{firm}/sign-up'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    UnsupportedMediaType:
      description: '`UNSUPPORTED_MEDIA_TYPE`: the body is not JSON (an HTML form, for example)'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    OriginNotAllowed:
      description: '`ORIGIN_NOT_ALLOWED`: not sent from the site''s own pages in the browser'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    NotPending:
      description: '`NOT_PENDING`: someone already approved or declined it'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  schemas:
    HexColor: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
    Timestamp: { type: string, format: date-time }
    LegalVersion:
      type: object
      required: [version, publishedAt]
      properties:
        version: { type: integer, minimum: 1 }
        publishedAt: { $ref: '#/components/schemas/Timestamp' }
    PortalInfo:
      type: object
      required: [business, branding, signUpOpen, legal]
      properties:
        business:
          type: object
          required: [slug, name]
          properties:
            slug: { type: string }
            name: { type: string }
        branding:
          type: object
          required: [logoUrl, primaryColor, accentColor, portalName, header, welcomeMessage]
          properties:
            logoUrl: { type: [string, 'null'], format: uri, description: Null until R5 serves logos }
            primaryColor: { $ref: '#/components/schemas/HexColor' }
            accentColor: { $ref: '#/components/schemas/HexColor' }
            portalName: { type: string, description: 'Default: "<firm name> Client Portal"' }
            header: { type: [string, 'null'], description: Landing heading; null shows the default }
            welcomeMessage: { type: [string, 'null'], description: Landing text; null shows the default }
        signUpOpen:
          type: boolean
          description: False when the firm closed sign-ups or has not published Terms and Privacy
        legal:
          type: object
          required: [terms, privacy]
          properties:
            terms: { oneOf: [{ $ref: '#/components/schemas/LegalVersion' }, { type: 'null' }] }
            privacy: { oneOf: [{ $ref: '#/components/schemas/LegalVersion' }, { type: 'null' }] }
    LegalDocument:
      type: object
      required: [kind, version, publishedAt, body]
      properties:
        kind: { type: string, enum: [terms, privacy] }
        version: { type: integer, minimum: 1 }
        publishedAt: { $ref: '#/components/schemas/Timestamp' }
        body: { type: string, description: Markdown }

    Phone:
      type: string
      pattern: '^\+1[2-9]\d{2}[2-9]\d{6}$'
      description: |
        The sign-up phone, where the SMS code goes (`SmsPhone` in packages/types): a US number in
        E.164 (+1 and 10 digits), as an SMS cost guard. Caribbean, Canadian, premium-rate (900) and
        non-geographic area codes (N11, N9X, 37X, 96X, 456, 500, 533, 600, 700, 710, toll-free 8XX,
        822, 880-889) are refused; US territories are allowed. The client strips spaces, dots,
        brackets and dashes, and reads 10 digits without +1 as US. Every other phone field (client
        records, firm applications) takes any country in E.164 (`Phone`; Rasel, Oct 8).
    SignUpRequest:
      type: object
      required: [name, email, phone, password, accountType, accepted]
      properties:
        name: { type: string, minLength: 1, maxLength: 200, description: Full Name }
        email: { $ref: './auth.yaml#/components/schemas/Email' }
        phone: { $ref: '#/components/schemas/Phone' }
        password: { $ref: './auth.yaml#/components/schemas/Password' }
        accountType: { type: string, enum: [INDIVIDUAL, BUSINESS] }
        accepted:
          type: object
          required: [termsVersion, privacyVersion]
          properties:
            termsVersion: { type: integer, minimum: 1 }
            privacyVersion: { type: integer, minimum: 1 }
    SignUpState:
      type: object
      required: [step, email, phoneMasked, resendAvailableAt]
      properties:
        step: { type: string, enum: [VERIFY_EMAIL, VERIFY_PHONE, DONE] }
        email: { type: string }
        phoneMasked: { type: string, description: 'For example "(770) ***-0123"' }
        resendAvailableAt:
          oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
          description: When Resend Code works again; null once the step is done
    VerifyCodeRequest:
      type: object
      required: [code]
      properties:
        code: { $ref: './auth.yaml#/components/schemas/OneTimeCode' }
    ResendCodeRequest:
      type: object
      required: [channel]
      properties:
        channel: { type: string, enum: [email, phone] }
    ChangeEmailRequest:
      type: object
      required: [email]
      properties:
        email: { $ref: './auth.yaml#/components/schemas/Email' }
    ChangePhoneRequest:
      type: object
      required: [phone]
      properties:
        phone: { $ref: '#/components/schemas/Phone' }

    ClientSignUp:
      type: object
      required:
        - clientAccountId
        - name
        - email
        - phone
        - accountType
        - status
        - signedUpAt
        - declinedAt
        - declineReason
        - existingClient
      properties:
        clientAccountId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        phone: { type: string, description: E.164 }
        accountType: { type: string, enum: [INDIVIDUAL, BUSINESS] }
        status: { type: string, enum: [PENDING_APPROVAL, DECLINED] }
        signedUpAt: { $ref: '#/components/schemas/Timestamp' }
        declinedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        declineReason: { type: [string, 'null'] }
        existingClient:
          description: |
            A client record of this firm that approve would link to (`clientId`): its email is the
            sign-up's verified email (both lower-cased) and it has no primary portal login yet.
            Null when there is none.
          oneOf:
            - type: object
              required: [clientId, displayName]
              properties:
                clientId: { type: string, format: uuid }
                displayName: { type: string }
            - { type: 'null' }
    ClientSignUpList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ClientSignUp' } }
        nextCursor: { type: [string, 'null'], description: Pass as `cursor`; null on the last page }
    ApproveSignUpRequest:
      type: object
      additionalProperties: false
      properties:
        clientId:
          type: string
          format: uuid
          description: |
            Link to this existing client record of the firm instead of creating one. Only a record
            whose email is the sign-up's verified email (both lower-cased) and that has no primary
            portal login yet.
    ApproveSignUpResponse:
      type: object
      required: [clientAccountId, clientId, status, approvedAt]
      properties:
        clientAccountId: { type: string, format: uuid }
        clientId: { type: string, format: uuid, description: The client record, new or linked }
        status: { const: ACTIVE }
        approvedAt: { $ref: '#/components/schemas/Timestamp' }
    DeclineSignUpRequest:
      type: object
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    DeclineSignUpResponse:
      type: object
      required: [clientAccountId, status, declinedAt]
      properties:
        clientAccountId: { type: string, format: uuid }
        status: { const: DECLINED }
        declinedAt: { $ref: '#/components/schemas/Timestamp' }

    ApiError:
      allOf: [{ $ref: './auth.yaml#/components/schemas/ApiError' }]
      description: |
        Codes of these routes: SIGN_UP_CLOSED (403), ORIGIN_NOT_ALLOWED (403),
        UNSUPPORTED_MEDIA_TYPE (415), TERMS_OUTDATED (409), SIGN_UP_EXPIRED (410),
        CODE_INVALID (400), ALREADY_VERIFIED (409), WRONG_STEP (409), NOT_PENDING (409),
        CLIENT_NOT_LINKABLE (409), DUPLICATE_EMAIL (409), plus the auth and generic codes in
        auth.yaml.
