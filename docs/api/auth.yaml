openapi: 3.1.0
info:
  title: Firmivra auth API (staff and Super Admin)
  version: 0.1.0
  description: |
    Sign-in contract for the firm site (`app.firmivra.com`, prefix `/auth`) and the Super Admin
    site (`admin.firmivra.com`, prefix `/admin/auth`). Both prefixes take the same bodies. Client
    portal sign-in reuses them under `/portal/{slug}/auth` (client-auth.yaml). Design:
    docs/AUTH-DESIGN.md.

    **Source of truth:** the zod schemas in `packages/types/src/auth/schemas.ts`, with typed calls
    in `createStaffAuthClient` and `createAdminAuthClient` (web: `staffAuth`, `adminAuth` in
    `apps/web/src/lib/auth.ts`). If this file and the zod schemas differ, the zod schemas win.

    ## Screen flow

    ```
    sign-in ──┬── MFA_REQUIRED ─────────────────────────► mfa ──► SIGNED_IN
              └── MFA_SETUP_REQUIRED ──► mfa/setup (QR) ──► mfa ──► SIGNED_IN
    activation link ──► activation/check ─┬─ new person: activate ──► MFA_SETUP_REQUIRED ──► (as above)
                                          └─ hasAccount: sign-in ──► activation/accept ──► /me
    forgot-password ──► (6-digit code by email) ──► reset-password ──► sign-in
    ```

    - MFA (authenticator app) is required on both sites, so sign-in normally returns an MFA step.
      Screens must still handle `SIGNED_IN`.
    - `session` is opaque and lives about 3 minutes. Send it back unchanged with the code.
      `MFA_CODE_INVALID`: stay on the code screen. `CHALLENGE_EXPIRED`: back to sign-in.
    - After `SIGNED_IN`, `me.memberships` (status `ACTIVE`) decides: none, show "no access";
      one, open it; several, show the firm picker and send its id as `x-business-id`.
    - Errors never say whether an account exists: sign-in, forgot-password and reset-password
      give the same answer for unknown emails.

    ## Cookies

    The browser never sees a token. The API sets these cookies: `HttpOnly`, `Secure` (except
    plain-http localhost), host-only (no `Domain`), so the admin and app sites never share a
    session. Each site uses its own names.

    | Cookie  | Firm site    | Super Admin site   | Path                                      | Lifetime | SameSite |
    | ------- | ------------ | ------------------ | ----------------------------------------- | -------- | -------- |
    | access  | `fv_access`  | `fv_admin_access`  | `/`                                       | 15 min   | Lax      |
    | id      | `fv_id`      | `fv_admin_id`      | `/`                                       | 15 min   | Lax      |
    | refresh | `fv_refresh` | `fv_admin_refresh` | `/api/v1/auth` or `/api/v1/admin/auth`    | 7 days (firm), 1 day (Super Admin) | Strict   |

    `SIGNED_IN` sets all three; `refresh` renews access and id; `sign-out` clears all three. The
    refresh path covers sign-out too, so sign-out can revoke the refresh token. Bodies are
    `application/json`.

    Each site accepts only its own session. Routes under `/api/v1/admin/` read only the
    `fv_admin_*` cookies and accept only Super Admins; every other route reads only the `fv_*`
    cookies and never accepts a Super Admin session, not even as a Bearer token. So the Super
    Admin site reads its `/me` from `GET /admin/me`. The `/admin/` match ignores letter case,
    as routing does.

    Requests from other sites are refused. Every POST, PUT, PATCH and DELETE must send its body
    as `application/json` (else `415 UNSUPPORTED_MEDIA_TYPE`), and a browser request must come
    from the route's own site: `Origin` is the admin site's origin for `/api/v1/admin/*`, the
    portal's for `/api/v1/portal/*`, and the app or portal site's origin for the rest (else
    `403 ORIGIN_NOT_ALLOWED`). Without `Origin`,
    only `Sec-Fetch-Site: same-origin` passes. A change with neither header but with a session
    cookie (server code relaying the user's session) is refused too. The API sends no CORS
    headers: each site calls it on its own host.

    ## Calling the API from the web app

    - **Changes (POST, PUT, PATCH, DELETE) go from the browser only**, to `/api/v1/...` on the
      page's own host, with the shared clients (`api`, `staffAuth`, `adminAuth` in
      `apps/web/src/lib`). They send JSON with `credentials: 'include'`; the browser adds
      `Origin` and the HttpOnly cookies. Call them from client components. No HTML forms to
      `/api/v1` (415), no calls to another site's host (403; there is no CORS).
    - **Server-side code** (server components, route handlers, server actions, `proxy.ts`)
      **only reads**: a GET to the API with the incoming `cookie` header forwarded, for example
      `/me` before rendering. It never sends a change with the user's cookie: Node's `fetch`
      sends no `Origin`, so the API answers `403 ORIGIN_NOT_ALLOWED`. Hand the change back to a
      client component instead.
    - **Refresh runs in the browser**: when a call answers 401, call `refresh` once and retry.
      The refresh cookie is `SameSite=Strict` and only goes to the `auth` paths, so server code
      never has it. A server-side GET that answers 401 renders the signed-out state.
    - Locally, `APP_BASE_URL`, `PORTAL_BASE_URL` and `ADMIN_BASE_URL` in `.env` must match the
      address in the browser, port included, or every change answers 403.

    ## Password policy

    Same as the Cognito pools (infra auth stack): at least 12 characters, a lower-case letter, an
    upper-case letter and a number; no symbol needed; no space at the start or end; at most 256
    characters. Cognito also blocks known leaked passwords (`PASSWORD_REJECTED`). `PASSWORD_RULES`
    in the zod file lists the rules for a checklist on the screen. Sign-in does not apply the policy.

    ## Rate limits

    `sign-in`, `mfa`, `mfa/setup`, `forgot-password`, `reset-password`, `activation/check` and
    `activate` answer `429 RATE_LIMITED` when called too often. Limits count per viewer IP (the
    address CloudFront saw, not the load balancer's), and from R2 step 7 also per email or
    session. Show "Too many attempts. Wait a few minutes and try again."

    ## Local development

    With `AUTH_MODE=local` (development and test only) the sign-in endpoints work without AWS
    for the seeded users, with the same steps and errors as Cognito:

    - password `Firmivra-local-1` for every seeded user;
    - authenticator code `000000`; the setup key is `JBSWY3DPEHPK3PXP`, so the QR code is real;
    - each user's first sign-in after the API starts returns `MFA_SETUP_REQUIRED`, later ones
      `MFA_REQUIRED`;
    - `forgot-password` sends nothing; the reset code is `000000`, and the new password works
      until the API restarts;
    - `refresh` and `sign-out` work as in AWS, but nothing is revoked locally;
    - invites send no email: the activation link appears in the API log (only with
      `AUTH_MODE=local`; elsewhere nothing is sent until R6 and no token is ever logged).

    `POST /dev/token` still signs in as a seeded user in one step and sets that site's access
    cookie (`fv_admin_access` for a Super Admin, `fv_access` otherwise).

servers:
  - url: /api/v1
    description: Same host as the site. The browser never calls another origin.
  - url: http://localhost:4000/api/v1
    description: Local API

tags:
  - name: sign-in
    description: Same operation under `/auth` (firm site) and `/admin/auth` (Super Admin site).
  - name: activation
    description: Firm site only. Invites from owners and admins, and the activation link.
  - name: session
  - name: local
    description: AUTH_MODE=local only. Never available outside development.

paths:
  /auth/sign-in: { $ref: '#/components/pathItems/SignIn' }
  /auth/mfa: { $ref: '#/components/pathItems/Mfa' }
  /auth/mfa/setup: { $ref: '#/components/pathItems/MfaSetup' }
  /auth/refresh: { $ref: '#/components/pathItems/Refresh' }
  /auth/sign-out: { $ref: '#/components/pathItems/SignOut' }
  /auth/forgot-password: { $ref: '#/components/pathItems/ForgotPassword' }
  /auth/reset-password: { $ref: '#/components/pathItems/ResetPassword' }

  /admin/auth/sign-in: { $ref: '#/components/pathItems/SignIn' }
  /admin/auth/mfa: { $ref: '#/components/pathItems/Mfa' }
  /admin/auth/mfa/setup: { $ref: '#/components/pathItems/MfaSetup' }
  /admin/auth/refresh: { $ref: '#/components/pathItems/Refresh' }
  /admin/auth/sign-out: { $ref: '#/components/pathItems/SignOut' }
  /admin/auth/forgot-password: { $ref: '#/components/pathItems/ForgotPassword' }
  /admin/auth/reset-password: { $ref: '#/components/pathItems/ResetPassword' }

  /auth/invites:
    post:
      tags: [activation]
      operationId: createInvite
      summary: Invite a staff member to the current firm
      description: |
        The owner invites admins and staff; an admin invites staff (403 `FORBIDDEN` otherwise).
        Owners are never invited here (the platform invites a new firm's owner on approval).
        Creates the person if needed, an `INVITED` membership and a one-time activation link,
        valid 7 days, emailed as `{APP_BASE_URL}/activate#token=...`. The token is in the URL
        fragment, so it never reaches a server log or a Referer header: the page reads it and
        sends it in the body. Inviting someone with an open invite sends a new link (the old one
        stops working); a deactivated member is invited again. The answer is the same whether or
        not the person already works at another firm. The email address is lower-cased.

        Works while the firm is in setup (the setup wizard's "Team and access" step) or active;
        a suspended or closed firm gets 403 `BUSINESS_INACTIVE`. A firm sends at most 50 links a
        day and one person at most 5 (resends included), else 429 `RATE_LIMITED`.
      security: [{ firmCookie: [] }, { bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/BusinessId' }]
      requestBody: { $ref: '#/components/requestBodies/CreateInvite' }
      responses:
        '201':
          description: Invite created and sent
          content:
            application/json: { schema: { $ref: '#/components/schemas/InviteResponse' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ALREADY_MEMBER`: the email already has an active membership in this firm'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/activation/check:
    post:
      tags: [activation]
      operationId: checkActivation
      summary: Check an activation link before showing the password form
      description: |
        `hasAccount: true` means the person already has a login (staff at another firm): show
        "sign in to join", then call `activation/accept`. Otherwise show the password form.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ActivationCheckRequest' } }
      responses:
        '200':
          description: The invite, for the screen's heading
          content:
            application/json: { schema: { $ref: '#/components/schemas/ActivationCheckResponse' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/InviteInvalid' }
        '410': { $ref: '#/components/responses/InviteExpired' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/activate:
    post:
      tags: [activation]
      operationId: activate
      summary: Set the password from an activation link
      description: |
        For a new person only. Uses up the link; the result is `MFA_SETUP_REQUIRED`. When the
        person already has a login it answers 409 `ACCOUNT_EXISTS` and changes nothing, so an
        invite can never reset an existing account's password. The password is set only while
        this request holds the link: of two activations at once, or an activation and a resend,
        only one uses it, and a failure leaves the link working. Expiry follows the database's
        clock (410).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ActivateRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/SignInResult' }
        '400': { $ref: '#/components/responses/PasswordFailed' }
        '404': { $ref: '#/components/responses/InviteInvalid' }
        '409':
          description: '`ACCOUNT_EXISTS`: the person already has a login; sign in and accept'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '410': { $ref: '#/components/responses/InviteExpired' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/activation/accept:
    post:
      tags: [activation]
      operationId: acceptInvite
      summary: Join the invite's firm with an existing login
      description: |
        Signed in on the firm site. Only the invited person can use the link (404 otherwise).
        Uses up the link and answers the new `/me`, so the firm picker shows the firm.
      security: [{ firmCookie: [] }, { bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AcceptInviteRequest' } } }
      responses:
        '200':
          description: Joined; the person's memberships now include the firm
          content: { application/json: { schema: { $ref: '#/components/schemas/MeResponse' } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/InviteInvalid' }
        '410': { $ref: '#/components/responses/InviteExpired' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me:
    get:
      tags: [session]
      operationId: me
      summary: The signed-in person and the firms they can open
      description: Firm and portal sites. A Super Admin session gets 401 here; use `/admin/me`.
      security: [{ firmCookie: [] }, { bearer: [] }]
      responses:
        '200':
          description: Roles come from the database on every request
          content: { application/json: { schema: { $ref: '#/components/schemas/MeResponse' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /admin/me:
    get:
      tags: [session]
      operationId: adminMe
      summary: The signed-in Super Admin (Super Admin site)
      security: [{ adminCookie: [] }, { bearer: [] }]
      responses:
        '200':
          description: Same body as `/me`, with `platformAdmin` true
          content: { application/json: { schema: { $ref: '#/components/schemas/MeResponse' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /dev/token:
    post:
      tags: [local]
      operationId: devToken
      summary: Sign in as a seeded user (AUTH_MODE=local)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DevTokenRequest' } } }
      responses:
        '200':
          description: Signed in; sets the site's access cookie
          content: { application/json: { schema: { $ref: '#/components/schemas/DevTokenResponse' } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /dev/sign-out:
    post:
      tags: [local]
      operationId: devSignOut
      summary: Clear the local session cookie
      responses:
        '200': { $ref: '#/components/responses/Ok' }

components:
  pathItems:
    SignIn:
      post:
        tags: [sign-in]
        summary: Sign in with email and password
        requestBody:
          required: true
          content: { application/json: { schema: { $ref: '#/components/schemas/SignInRequest' } } }
        responses:
          '200': { $ref: '#/components/responses/SignInResult' }
          '400': { $ref: '#/components/responses/ValidationFailed' }
          '401':
            description: '`INVALID_CREDENTIALS`: "Email or password is incorrect", also for unknown emails'
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          '429': { $ref: '#/components/responses/RateLimited' }

    Mfa:
      post:
        tags: [sign-in]
        summary: Send the authenticator code
        description: For `MFA_REQUIRED`, and for the first code after `mfa/setup`.
        requestBody:
          required: true
          content: { application/json: { schema: { $ref: '#/components/schemas/MfaRequest' } } }
        responses:
          '200': { $ref: '#/components/responses/SignInResult' }
          '400': { $ref: '#/components/responses/ValidationFailed' }
          '401':
            description: |
              `MFA_CODE_INVALID`: wrong code, try again with the same session.
              `CHALLENGE_EXPIRED`: start sign-in again.
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          '429': { $ref: '#/components/responses/RateLimited' }

    MfaSetup:
      post:
        tags: [sign-in]
        summary: Start first-time authenticator setup
        description: After `MFA_SETUP_REQUIRED`. Show `otpauthUri` as a QR code and `secret` as text.
        requestBody:
          required: true
          content: { application/json: { schema: { $ref: '#/components/schemas/MfaSetupRequest' } } }
        responses:
          '200':
            description: The key to add to the authenticator app, and a new session
            content: { application/json: { schema: { $ref: '#/components/schemas/MfaSetupResponse' } } }
          '400': { $ref: '#/components/responses/ValidationFailed' }
          '401': { $ref: '#/components/responses/ChallengeExpired' }
          '429': { $ref: '#/components/responses/RateLimited' }

    Refresh:
      post:
        tags: [session]
        summary: Renew the access cookie from the refresh cookie
        description: |
          No body. Call it when a request answers 401 `UNAUTHENTICATED`, then retry once. The
          person must still be allowed to sign in (user still there; on the Super Admin site,
          still a Super Admin); if not, the refresh token is revoked and the cookies cleared (401).
          Refreshing never makes a session longer than 7 days (firm) or 1 day (Super Admin).
        responses:
          '200': { $ref: '#/components/responses/Ok' }
          '401': { $ref: '#/components/responses/Unauthenticated' }

    SignOut:
      post:
        tags: [session]
        summary: Sign out
        description: |
          Always succeeds and clears this site's cookies, even when already signed out or when
          the body cannot be read (then it is not `everywhere`). Revokes the refresh token. With
          `everywhere: true` and a valid session, also ends the person's sessions on every other
          device.
        requestBody:
          required: false
          content: { application/json: { schema: { $ref: '#/components/schemas/SignOutRequest' } } }
        responses:
          '200': { $ref: '#/components/responses/Ok' }

    ForgotPassword:
      post:
        tags: [sign-in]
        summary: Email a 6-digit reset code
        description: 'Always `{ ok: true }`, whether or not the account exists.'
        requestBody:
          required: true
          content:
            application/json: { schema: { $ref: '#/components/schemas/ForgotPasswordRequest' } }
        responses:
          '200': { $ref: '#/components/responses/Ok' }
          '400': { $ref: '#/components/responses/ValidationFailed' }
          '429': { $ref: '#/components/responses/RateLimited' }

    ResetPassword:
      post:
        tags: [sign-in]
        summary: Set a new password with the emailed code
        description: |
          Ends every session of the person. They sign in again with the new password. Real and
          unknown emails get the same answers: any failure is `RESET_CODE_INVALID`, and after 5
          failures for an email within 15 minutes every attempt for it answers `429 RATE_LIMITED`
          until the window passes.
        requestBody:
          required: true
          content:
            application/json: { schema: { $ref: '#/components/schemas/ResetPasswordRequest' } }
        responses:
          '200': { $ref: '#/components/responses/Ok' }
          '400':
            description: |
              `VALIDATION_FAILED` (policy, in `details`) or `RESET_CODE_INVALID`: wrong or expired
              code, an unknown email, or a password Cognito refuses (for example a known leaked
              one). Show "That code is not right or has expired, or choose another password." 
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          '429': { $ref: '#/components/responses/RateLimited' }

  parameters:
    BusinessId:
      name: x-business-id
      in: header
      required: false
      description: |
        The firm to act in, for staff with more than one firm (from the firm picker). The API
        checks it against the caller's ACTIVE membership in that firm and answers 404 NOT_FOUND
        otherwise, also for a firm that does not exist, so it can never reach another firm.
      schema: { type: string, format: uuid }

  requestBodies:
    CreateInvite:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/CreateInviteRequest' } } }

  securitySchemes:
    firmCookie: { type: apiKey, in: cookie, name: fv_access }
    adminCookie: { type: apiKey, in: cookie, name: fv_admin_access }
    bearer:
      type: http
      scheme: bearer
      description: Tests and server-side calls only. Browsers use the cookies.

  responses:
    SignInResult:
      description: Next step, or `SIGNED_IN` with the cookies set
      content: { application/json: { schema: { $ref: '#/components/schemas/SignInResult' } } }
    Ok:
      description: Done
      content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } }
    ValidationFailed:
      description: '`VALIDATION_FAILED`: the body does not match the schema; field errors in `details`'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    PasswordFailed:
      description: '`VALIDATION_FAILED` (policy, in `details`) or `PASSWORD_REJECTED` (Cognito refused it)'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Unauthenticated:
      description: '`UNAUTHENTICATED`: no valid session. Refresh once, then go to sign-in.'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    ChallengeExpired:
      description: '`CHALLENGE_EXPIRED`: the sign-in step expired. Start sign-in again.'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Forbidden:
      description: '`FORBIDDEN`: signed in, but this role may not do this'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    NotFound:
      description: '`NOT_FOUND`: no such firm, or no place in it (never 403, so firms do not leak)'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    InviteInvalid:
      description: '`INVITE_INVALID`: unknown or already used link'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    InviteExpired:
      description: '`INVITE_EXPIRED`: the link is older than 7 days. Ask for a new invite.'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    RateLimited:
      description: '`RATE_LIMITED`: too many attempts. Wait and try again.'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  schemas:
    Email:
      type: string
      format: email
      maxLength: 254
      description: Trimmed and lower-cased before sending.
    Password:
      type: string
      minLength: 12
      maxLength: 256
      description: See "Password policy" above.
    OneTimeCode:
      type: string
      pattern: '^\d{6}$'
      description: Six digits. The client strips spaces before sending.
    ChallengeSession:
      type: string
      minLength: 1
      maxLength: 8192
      description: Opaque sign-in step, about 3 minutes. Send it back unchanged.
    Timestamp: { type: string, format: date-time }

    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { type: string, minLength: 1, maxLength: 256 }
    SignInResult:
      oneOf:
        - $ref: '#/components/schemas/SignedIn'
        - $ref: '#/components/schemas/MfaRequired'
        - $ref: '#/components/schemas/MfaSetupRequired'
      discriminator:
        propertyName: status
        mapping:
          SIGNED_IN: '#/components/schemas/SignedIn'
          MFA_REQUIRED: '#/components/schemas/MfaRequired'
          MFA_SETUP_REQUIRED: '#/components/schemas/MfaSetupRequired'
    SignedIn:
      type: object
      required: [status, me]
      properties:
        status: { const: SIGNED_IN }
        me: { $ref: '#/components/schemas/MeResponse' }
    MfaRequired:
      type: object
      required: [status, session]
      properties:
        status: { const: MFA_REQUIRED }
        session: { $ref: '#/components/schemas/ChallengeSession' }
    MfaSetupRequired:
      type: object
      required: [status, session]
      properties:
        status: { const: MFA_SETUP_REQUIRED }
        session: { $ref: '#/components/schemas/ChallengeSession' }
    MfaRequest:
      type: object
      required: [session, code]
      properties:
        session: { $ref: '#/components/schemas/ChallengeSession' }
        code: { $ref: '#/components/schemas/OneTimeCode' }
    MfaSetupRequest:
      type: object
      required: [session]
      properties:
        session: { $ref: '#/components/schemas/ChallengeSession' }
    MfaSetupResponse:
      type: object
      required: [session, secret, otpauthUri]
      properties:
        session: { $ref: '#/components/schemas/ChallengeSession' }
        secret: { type: string, description: Base32 key for typing in by hand }
        otpauthUri: { type: string, pattern: '^otpauth://totp/', description: Show as a QR code }
    SignOutRequest:
      type: object
      properties:
        everywhere: { type: boolean, default: false }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { $ref: '#/components/schemas/Email' }
    ResetPasswordRequest:
      type: object
      required: [email, code, password]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        code: { $ref: '#/components/schemas/OneTimeCode' }
        password: { $ref: '#/components/schemas/Password' }

    InviteRole: { type: string, enum: [ADMIN, STAFF] }
    CreateInviteRequest:
      type: object
      required: [email, name, role]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        name: { type: string, minLength: 1, maxLength: 200 }
        role: { $ref: '#/components/schemas/InviteRole' }
    InviteResponse:
      type: object
      required: [id, membershipId, email, name, role, expiresAt]
      properties:
        id: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/InviteRole' }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
    ActivationCheckRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 512
          description: From the link's fragment, /activate#token=...
    ActivationCheckResponse:
      type: object
      required: [email, name, role, business, expiresAt, hasAccount]
      properties:
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [OWNER, ADMIN, STAFF] }
        business: { $ref: '#/components/schemas/BusinessSummary' }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        hasAccount:
          type: boolean
          description: Already has a login (sign in, then accept) rather than a new password
    AcceptInviteRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 20, maxLength: 512 }
    ActivateRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 20, maxLength: 512 }
        password: { $ref: '#/components/schemas/Password' }
        name: { type: string, minLength: 1, maxLength: 200, description: Correct the invited name }

    BusinessSummary:
      type: object
      required: [id, slug, name, status]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        status: { type: string, enum: [PENDING_SETUP, ACTIVE, SUSPENDED, CLOSED] }
    MeResponse:
      type: object
      required: [user, memberships, clientAccounts, platformAdmin]
      properties:
        user:
          type: object
          required: [id, email, name, pool]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            name: { type: string }
            pool: { type: string, enum: [STAFF, CLIENT, ADMIN] }
        memberships:
          type: array
          items:
            type: object
            required: [business, role, status]
            properties:
              business: { $ref: '#/components/schemas/BusinessSummary' }
              role: { type: string, enum: [OWNER, ADMIN, STAFF] }
              status: { type: string, enum: [INVITED, ACTIVE, DEACTIVATED] }
        clientAccounts:
          type: array
          items:
            type: object
            required: [business, status]
            properties:
              business: { $ref: '#/components/schemas/BusinessSummary' }
              status:
                { type: string, enum: [INVITED, PENDING_APPROVAL, ACTIVE, DECLINED, DISABLED] }
        platformAdmin: { type: boolean }

    DevTokenRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        pool: { type: string, enum: [STAFF, CLIENT, ADMIN] }
    DevTokenResponse:
      type: object
      required: [token, expiresIn, user]
      properties:
        token: { type: string }
        expiresIn: { type: integer, minimum: 1 }
        user: { $ref: '#/components/schemas/MeResponse/properties/user' }

    Ok:
      type: object
      required: [ok]
      properties:
        ok: { const: true }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Stable. Auth codes: PASSWORD_REJECTED, RESET_CODE_INVALID, INVALID_CREDENTIALS,
                MFA_CODE_INVALID, CHALLENGE_EXPIRED, INVITE_INVALID, ALREADY_MEMBER,
                INVITE_EXPIRED, ACCOUNT_EXISTS. Generic: VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN,
                NOT_FOUND, RATE_LIMITED, INTERNAL_ERROR, SERVICE_BUSY (503 with Retry-After: the
                database is busy, try again shortly), UNSUPPORTED_MEDIA_TYPE (415, the body
                is not JSON), ORIGIN_NOT_ALLOWED (403, sent from another site). Firm routes:
                BUSINESS_REQUIRED (400, choose a firm with x-business-id), BUSINESS_SETUP_REQUIRED
                (403, the firm has not finished setup), BUSINESS_INACTIVE (403, suspended or
                closed).
            message: { type: string, description: For people; may change }
            requestId: { type: string }
            details: {}
