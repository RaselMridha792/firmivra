openapi: 3.1.0
info:
  title: Firmivra documents API
  version: 0.1.0
  description: |
    A client's files and document requests: the firm's client record > Documents tab (Fahad, F07)
    and the portal's My Documents with its Upload Documents pop-up (Nahid, N05).

    **Source of truth:** the zod schemas in `packages/types/src/documents/schemas.ts`, with typed
    calls in `createDocumentsClient` (web: `api.documents`) and `createMyDocumentsClient` (web:
    `api.myDocuments(slug)`), and the browser helper `uploadFile()` in
    `apps/web/src/lib/upload.ts`. Mock mode: `apps/web/src/mocks/documents.ts`
    (`NEXT_PUBLIC_API_MOCK=documents,myDocuments`). Schemas below name their zod schema; if this
    file and the zod schemas differ, the zod schemas win.

    ## Upload, in three calls

    `uploadFile(file, { start, finish, onProgress })` runs all three:

    1. `POST .../documents/uploads` with the service, optional request, category and tax year,
       plus the file's name, type, size and SHA-256. The API checks that the service is open
       (ACTIVE engagement), the request is open, the category is active, and the limits, then
       answers an `UploadTicket`: a one-time URL valid for a few minutes, the headers to send,
       and an `uploadToken`.
    2. The browser `PUT`s the file to `ticket.url` with exactly `ticket.headers`. The file goes
       straight to storage under the firm's own prefix (`tenant/{businessId}/...`), at a key the
       API chooses; the API never streams it. Storage refuses bytes that don't match the signed
       type, length and checksum.
    3. `POST .../documents/uploads/confirm` with the `uploadToken`. The API checks the stored
       object (size, magic bytes, checksum; an Excel or Word file also as a package, see "Rules
       for the API"), saves the document and starts the malware scan. `410 UPLOAD_EXPIRED` for
       an old or used token; `409 UPLOAD_MISMATCH` if the stored file is not what step 1
       described; `409 FILE_PASSWORD_PROTECTED` or `409 FILE_HAS_MACROS` for an Excel or Word
       file saved with a password or holding macros; `503 SERVICE_UNAVAILABLE` (with
       `Retry-After`) when storage fails or is busy: nothing is deleted, confirm again.
       `uploadFile()` does that itself: it confirms again with the same token after
       `Retry-After` (at most 30 seconds), up to 3 times (`retryWhenUnavailable`).

    Limits (`UPLOAD_LIMITS`), the same for clients and staff: PDF, JPG, PNG, Excel (.xlsx) or
    Word (.docx), at most 10 MB. Office files only without macros: `.xls`, `.xlsm`, `.doc`,
    `.docm` and `.csv` are refused (their types are not in the list, and a name's ending must fit
    its declared type, so a `Budget.xlsm` sent as an .xlsx is refused too). A browser may give an
    .xlsx or .docx no type (`''` or `application/octet-stream`): `uploadFile()` then takes the
    type from the name's ending (`uploadContentTypeFor`). It refuses a file of another type, an
    empty one or one over 10 MB before anything is sent (`400 FILE_TYPE_NOT_ALLOWED`,
    `FILE_EMPTY`, `FILE_TOO_LARGE`). Uploads are only for an open service (an ACTIVE
    engagement; a PENDING one takes none): the portal's pop-up reads
    `GET .../documents/upload-targets`; empty lists are its STOP state, and the API refuses the
    rest with `409 NO_OPEN_SERVICE` however it is reached.

    ## Rules

    - **Scan before download.** A new file is `PENDING` (portal: `CHECKING`) until the malware
      scan finishes. `GET .../download` answers a 5-minute link only for a `CLEAN` file, else
      `409 SCAN_PENDING` or `409 FILE_BLOCKED` (infected or failed). Every download is an
      attachment, whatever the type: the browser saves the file and never opens it inline.
    - **Scan results are final.** `INFECTED` and `FAILED` are final for users: they upload the
      file again, as a new upload (for a request, see "Requests"). `FAILED` means only that the
      file itself couldn't be scanned. When the scan breaks on our side, the file stays
      `PENDING`, an alarm fires, and we rescan it with GuardDuty's on-demand scan, never
      rewriting the object. Until GuardDuty is deployed, new uploads on dev stay `PENDING`
      (portal: "checking").
    - **What the client is told.** The portal never says a file failed the malware scan. It
      shows a `BLOCKED` file (`INFECTED` or `FAILED`) by its source (`PORTAL_BLOCKED_TEXT`): the
      client's own upload (`MINE`) as "This file couldn't be checked. Please upload it again.",
      a file the firm shared (`FIRM`) as "This file couldn't be checked. Ask your firm to share
      it again." The portal's `FILE_BLOCKED` for that file says the same. The firm sees the
      exact `scanStatus`.
    - **Error words.** `DOCUMENT_ERRORS` has what users see for every code of this module:
      screens show errors with `errorMessage(error, DOCUMENT_ERRORS)`. `FILE_PASSWORD_PROTECTED`
      is "Remove the password and upload the file again."; `FILE_HAS_MACROS` is "Save it as a
      regular .xlsx or .docx without macros and upload again." A file whose bytes are not what
      its type says stays `UPLOAD_MISMATCH`.
    - **Replacements.** A replacement is a new upload for the same request; the old file stays,
      and nothing links the two (no versions). A request takes uploads while it is `REQUESTED`
      or `REJECTED`.
    - **No deletes at launch.** There are no delete routes for documents or requests; the firm
      cancels a request instead.
    - **What the portal sees.** Only the signed-in client's own documents; never `INTERNAL` ones
      (firm only), and never another client's (404). "My Uploaded Documents" is `source=MINE`
      (`CLIENT_TO_FIRM`); "Firm Uploaded Documents" is `source=FIRM` (`FIRM_TO_CLIENT`). The list
      shows the client's own upload while it is being checked; downloads still wait for `CLEAN`.
      Other modules (for example R12's portal reports) link documents through these routes, so
      the same rule covers them.
    - **What the firm sees.** Staff reach only the clients they may see (as in R10's clients;
      others are 404). A file the firm uploads is `INTERNAL` unless `shareWithClient` is true.
    - **Requests.** The firm asks for a document within an open service. The client uploads for
      it (`SUBMITTED`) or says "I don't have this" (`NOT_AVAILABLE`, with a reason). A
      `SUBMITTED` request takes no second upload. If its newest file comes back `INFECTED` or
      `FAILED`, the API puts the request back to `REQUESTED` as it records that result: the
      client is asked again (it is back in `upload-targets` and Your Next Steps) and uploads
      again for it. The firm accepts (`ACCEPTED`) only when the newest file is `CLEAN`
      (`409 SCAN_PENDING` while it is being checked), or marks it missing (`REJECTED`, with a
      reason the client sees; the client is asked again), or cancels it. Requests are never
      deleted.
    - **File names** are display only: no control or invisible formatting characters, no line
      separators, no `/` or `\`, and the ending must fit the type (`.pdf` for a PDF, `.xlsx` for
      Excel). Storage keys are never built from them.
    - **Household logins (Rasel, q12).** PRIMARY and SPOUSE logins have the same access. An
      AUTHORIZED login sees only what it uploaded itself as `MINE`, an empty `FIRM` list and only
      open requests; it uploads only for an open request (403 without a `requestId`), never sees
      `INTERNAL` files and never answers "I don't have this" (403). Every upload records the
      login that made it (`uploaded_by_user_id`, and the client account in the sealed token and
      the audit), and portal items carry the uploader's name (`MyDocument.uploadedBy`: the
      household login's name on a `MINE` file; null on the firm's files, so no staff names reach
      the portal, and on a file with no known uploader). An AUTHORIZED login's `upload-targets`
      lists only the services with an open request, and its `document-requests` only the open
      requests.
    - **Request emails.** "Request a document" emails every ACTIVE portal login of the client
      (`document.requested`: the title, the due date and a link to the portal; R6 applies their
      preferences). A failed email never undoes the request.
    - **Audit and privacy.** Uploads, views (`get`), every download link issued and request
      changes are audited with ids only. File contents, names of other clients and storage URLs
      never reach logs, emails or SMS.
    - Every change comes from the browser (see "Calling the API from the web app" in auth.yaml).

    ## Rules for the API (R5 steps 2 to 6)

    - **Ticket.** The `uploadToken` is sealed (or stored) by the API and binds the business, the
      uploader (user and side), the client, service, request, category, direction, the S3 key,
      size, SHA-256 and an expiry of 15 minutes or less (a PUT that starts near the end of its
      URL can run until the browser's 10-minute timeout, and the confirm comes after it).
    - **Presigned PUT.** `Content-Type`, `Content-Length` and `x-amz-checksum-sha256` are in
      `X-Amz-SignedHeaders`; expiry 4 minutes (the token's 15 cover a slow upload and the confirm). (`Content-Length`
      is signed but not in `ticket.headers`: the browser sends it.) No SSE headers: objects take
      the bucket's default SSE-KMS with the documents key (see "KMS"). s3mock does not check
      signatures, so a unit test checks the presigned URL itself (signed headers, expiry).
    - **Confirm** re-reads the object (size, checksum, magic bytes; Excel and Word as below).
      Missing or different, or stored with a `Content-Encoding` (the PUT signs none, so a
      repeated PUT could add one): `409 UPLOAD_MISMATCH`, and the API deletes the object. The
      unique `s3_key` makes confirm single use (`410 UPLOAD_EXPIRED` the second time). Confirm's
      HEAD never asks for S3's checksum (on SSE-KMS that needs `kms:Decrypt`, and a 403 must not
      look like a missing file); it hashes the bytes itself. At most 4 confirms read a file at
      once in each API task (each holds up to 10 MB); one more is `503 SERVICE_UNAVAILABLE`.
    - **Storage failures.** Any S3 failure that isn't "no such object" (a 503 SlowDown, a
      timeout, a 403 from KMS) is `503 SERVICE_UNAVAILABLE` with `Retry-After: 5` on the ticket,
      confirm and the download, and deletes nothing; the log names the operation, the error's
      name and its HTTP status only. Every S3 call has timeouts (3 s to connect, 5 s for the
      answer's headers, 2 attempts; a GET has 30 s in all, its body included), and no S3 call
      runs while the upload holds a client, service or category row.
    - **Excel and Word (confirm).** An `.xlsx` or `.docx` must be an Office Open XML package
      without macros. Read it in memory and never unpack it to disk; each refusal deletes the
      object, as for a mismatch. The checks, in this order:
      1. A file that starts with the OLE2/CFB signature `D0 CF 11 E0 A1 B1 1A E1` and whose
         directory holds an `EncryptedPackage` stream is how Office saves a file with a
         password: `409 FILE_PASSWORD_PROTECTED`, not UPLOAD_MISMATCH. Read that directory with
         a bounded walk, not a general CFB library: sectors of 512 or 4096 bytes only; follow
         the DIFAT, FAT and directory chains for at most (file size / sector size) sectors,
         stopping at a sector seen twice or out of range; at most 10,000 directory entries;
         compare the names as UTF-16LE. A malformed CFB, or any other file that doesn't start
         with a ZIP header (`50 4B 03 04`), for example an old .xls or .doc renamed, is
         `409 UPLOAD_MISMATCH`.
      2. Read the ZIP's central directory (found from its end record, which must be there and
         whose comment must finish at the end of the file; a ZIP64 record is held to the same caps, and its locator and
         the end record must agree with it) without extracting anything, with a cap of 1 MB and
         10,000 entries. Entry names are compared without case, after turning `\` into `/` and
         dropping a leading `/`. A bigger or broken directory, an entry name with NUL or another
         control character, two entries with the same name, an entry with ZIP encryption, or a
         compression method other than 0 (stored) or 8 (deflate) is `409 UPLOAD_MISMATCH`. Then
         a `vbaProject` or `vbaData` part in any folder is `409 FILE_HAS_MACROS` at once, before
         `[Content_Types].xml` is read (step 4), so a macro file is FILE_HAS_MACROS whatever its
         XML holds.
      3. `[Content_Types].xml` must be at the root. Inflate only that entry, in memory: the 1 MB
         cap counts the bytes the inflater puts out (stop at 1 MB + 1 byte, for example with
         zlib's `maxOutputLength`), never the sizes in the headers, and an output whose size
         differs from the directory's is `409 UPLOAD_MISMATCH`. Parse it with DTDs, entity
         expansion and outside resolution off: a `<!DOCTYPE` (packages never have one) is
         `409 UPLOAD_MISMATCH`, as are a NUL and an encoding declaration other than UTF-8 or
         UTF-16. Compare the decoded `ContentType`, `Extension` and `PartName`
         values without case, never the raw text. Read it as a parser does: comments, processing
         instructions and CDATA end at their own terminators, and a `>` inside a quoted value
         ends no tag. XML that is not well-formed, and a `Default` or `Override` with a prefix
         or an attribute other than its own (Office writes neither), is `409 UPLOAD_MISMATCH`,
         after the macro check (step 4) has seen every declaration.
      4. Macros, before the main part: a `vbaProject` or `vbaData` part in any folder, or any
         `Default` or `Override` content type containing `macroEnabled`, `vbaProject`,
         `vbaData` or `macrosheet`, is `409 FILE_HAS_MACROS`. So an .xlsm or .docm renamed to
         .xlsx or .docx (its main part is macro-enabled) is `FILE_HAS_MACROS`, not a mismatch.
      5. The main part: `[Content_Types].xml` must name the declared type's main part, for .xlsx
         `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml` and for
         .docx `application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml`.
         Anything else (an .xltx, a .dotx or a renamed .pptx, for example) is
         `409 UPLOAD_MISMATCH`.
    - **Active content without macros (Rasel q23, Oct 8: accepted).** Only macro files are
      refused. Links to outside templates, objects or pictures (`TargetMode="External"`
      relationships), embedded OLE objects, ActiveX controls, altChunk imports and DDE fields are
      accepted: the malware scan reads what is inside the file, and Office opens a file
      downloaded from the web in Protected View by default.
    - **PDFs with a password (Rasel q24, Oct 8: accepted unscanned).** Confirm checks a PDF's
      magic bytes only, so a PDF that needs a password to open is stored. When GuardDuty answers
      `UNSUPPORTED` with the reason `PASSWORD_PROTECTED` for a PDF, the file is accepted
      unscanned, not `FAILED`: the firm can download it and accept its request. The reason goes
      into its audit entry, and the firm's document shows that it was not scanned (a contract
      field that comes with the result handler).
    - **Requests (API).** Every change locks in one order: the client (FOR SHARE), the
      engagement, the category, then the request (FOR UPDATE). An upload for a request seals
      `requestId` into its token; confirm locks the request last, refuses one that is no longer
      open (`409 REQUEST_CLOSED`, the object deleted and the refusal audited like every other)
      and sets it `SUBMITTED` in the transaction that saves the document, with its
      `document_request.submitted` audit entry. Accept, reject and cancel lock the client (Staff
      must reach it, else 404) and then the request; `ACCEPTED` and `CANCELLED` are closed
      (`409 REQUEST_CLOSED`), accept and reject need `SUBMITTED` (`409 NOTHING_SUBMITTED`), and
      accept a `CLEAN` newest file (`409 SCAN_PENDING` while it is checked). "I don't have this"
      takes only an open request of a client that isn't archived (`409 NO_OPEN_SERVICE`, as
      for its uploads). A new answer (an upload) clears the old `statusNote`.
    - **Scan results (GuardDuty Malware Protection for S3).** Results reach the API only
      through a private channel: an EventBridge rule (source `aws.guardduty`, detail-type
      `GuardDuty Malware Protection Object Scan Result`, the documents bucket) to an SQS queue
      that the API reads with its IAM role. There is no public route for them. The handler
      finds the document by its S3 key (and the confirmed version id, once R0's
      `s3_version_id` is there), never by a firm id in the message, and only moves a `PENDING`
      document to a result (the `documents_rules` trigger refuses to change a result once set).
      It maps the result and its `statusReasons`:
      - `NO_THREATS_FOUND` is `CLEAN`; `THREATS_FOUND` is `INFECTED`.
      - `UNSUPPORTED` because of the file itself (`PASSWORD_PROTECTED`,
        `OBJECT_SIZE_LIMIT_EXCEEDED`, `EXTRACTED_*_LIMIT_EXCEEDED` or
        `EXTRACTION_RATIO_LIMIT_EXCEEDED`) is `FAILED`; the reason goes into its audit entry, so
        the firm can learn why. One exception (Rasel q24): `PASSWORD_PROTECTED` on a PDF is
        accepted unscanned (see "PDFs with a password").
      - Everything else is our side and leaves the file `PENDING`: `UNSUPPORTED` with
        `UNSUPPORTED_STORAGE_CLASS` or no known reason, any `ACCESS_DENIED` (role, KMS key,
        bucket, a changed ETag) and `FAILED`. The alarm fires and we rescan it with GuardDuty's
        on-demand scan (`SendObjectMalwareScan` with the key and the confirmed version id); the
        object is never rewritten or copied to rescan it.
      - A `SUBMITTED` request whose newest file becomes `INFECTED` or `FAILED` goes back to
        `REQUESTED` in the same transaction (see "Requests"; kept, Rasel q22). A request the
        firm cancelled or marked missing, or the client answered "I don't have this", keeps its
        status and note.
      - GuardDuty scans the object as soon as the PUT ends, so a result can arrive before the
        confirm commits the document (a confirm may come up to the token's 15 minutes later,
        after a `503`). Such a result is `UNKNOWN` (logged with the upload id): the handler
        leaves the message on the queue for redelivery (a visibility timeout and a max receive
        count that cover 30 minutes), then dead-letters it to the alarm (an upload never
        confirmed or refused, its object deleted). `IGNORED` (delete the message) is only for a
        result already set or a key outside `tenant/{businessId}/documents/`.
      - Built (R5 API part 2): `ScanResultsService.recordScanResult({ key, status, reasons })`
        does all of the above for the handler to call (locks the request, then the document;
        audits `document.scanned` with the result and reasons, `document.scan_unfinished` for
        our side, `document_request.reopened`). A password-protected PDF becomes `CLEAN` with
        `unscanned: true` in its audit entry; the firm's document shows it once R0 adds a column
        for it (the contract field comes with that column).
    - **Replays.** A presigned PUT can be replayed until it expires and the bucket is versioned,
      so a download pins the confirmed version (R0: `documents.s3_version_id`) or the API checks
      the checksum before signing the GET. Today it checks the size, S3's checksum and that no
      `Content-Encoding` is set (`409 FILE_BLOCKED` otherwise).
    - **Presigned GET.** `response-content-disposition=attachment` for every file whatever its
      type (never `inline`), with an RFC 5987 file name, `response-content-type` set to the
      stored type, `response-content-encoding=identity` and `response-cache-control=private,
      no-store` (signed, so a `Content-Encoding` a repeated PUT stores after the check never
      reaches the browser), expiry 5 minutes, and an audit entry for every link.
    - **KMS (pending).** Today infra has one bucket key (data stack) and the API's IAM policy
      covers only it; objects take the bucket's default encryption with it. Per-firm keys for S3
      need their own IAM statement first: S3's encryption context is `aws:s3:arn` (the bucket or
      object ARN), not the firm, so a tag-conditioned statement for the firms' keys must allow
      `kms:GenerateDataKey` and `kms:Decrypt` through S3 (`kms:ViaService`) for objects under that
      firm's `tenant/{businessId}/` prefix. Then the PUT signs `x-amz-server-side-encryption`
      and the firm's key id.
    - **Scan mode.** `SCAN_MODE=guardduty` (the default) leaves a confirmed file `PENDING` for
      GuardDuty's result; `SCAN_MODE=local` marks it `CLEAN` at confirm and is refused by the
      settings check unless `NODE_ENV` is development or test (like `AUTH_MODE=local`), or
      `NODE_ENV` is production and `APP_ENV` is exactly `dev` (the dev environment, until
      GuardDuty is deployed there; every other `APP_ENV` is refused).
    - **Leftovers.** The API deletes every upload confirm refuses and audits it
      (`document.upload_refused`): the byte checks (mismatch, password, macros) and the refusals
      after the ticket (the caller no longer reaches the client, the service is no longer open,
      the category is archived). A refusal takes the key's transaction lock (the one confirm
      takes), finds no document with the key, audits itself and commits, and only then deletes
      the object; a confirm that comes later finds that refusal under the lock and saves
      nothing. So a refusal never deletes a saved document's file and no document is saved
      without its file. A storage failure (a 403 from KMS, for example) is a 503 and deletes
      nothing. An upload that is PUT but never
      confirmed (a closed tab) stays in the bucket today: under one prefix and without a tag, no
      lifecycle rule can tell it from a confirmed file. Planned (infra, with Rasel's yes): the
      PUT signs `x-amz-tagging: state=unconfirmed` (needs `s3:PutObjectTagging`), confirm
      removes the tag (`s3:DeleteObjectTagging`), and a lifecycle rule filtered on that tag
      expires the rest after a day. The bucket is versioned; noncurrent versions (left by every
      delete) already expire after 30 days (data stack).
    - **Infra (Rasel's AWS list, each with his yes first):**
      - GuardDuty Malware Protection for S3 on the documents bucket, its role as in AWS's
        template: `kms:Decrypt` and `kms:GenerateDataKey` through S3 (`kms:ViaService`) on the
        documents key and each per-firm key, and `s3:PutObject` on its
        `malware-protection-resource-validation-object`.
      - Its scan-result event: the EventBridge rule and the SQS queue the API reads (above).
      - The alarm for a scan that breaks on our side.
      - KMS access on the firms' own keys (tag conditioned), `s3:GetObjectVersion` if downloads
        pin versions, the tagging actions and the tag-filtered lifecycle rule for unconfirmed
        uploads ("Leftovers"), and a bucket policy that refuses a PutObject without
        `aws:kms`. That policy must let GuardDuty's validation object through, or the plan
        stays in WARNING (`INSUFFICIENT_TEST_OBJECT_PERMISSIONS`).
      - Until GuardDuty is deployed, new uploads on dev stay `PENDING`.

    ## Pages and calls

    | Page | Calls |
    | --- | --- |
    | Firm: client record > Documents | `GET .../clients/{id}/documents`, `GET document-categories`, `GET .../clients/{id}/document-requests`, download, request actions, uploads |
    | Portal: My Documents | `GET me/documents` (`source=MINE` or `FIRM`), `GET me/document-categories`, download |
    | Portal: Upload Documents pop-up | `GET me/documents/upload-targets`, then `uploadFile()` |
    | Portal: Your Next Steps | `GET me/document-requests`, `POST .../not-available`, upload with `requestId` |
servers:
  - url: /api/v1
    description: Same host as the site.

tags:
  - name: firm
    description: Firm site (Owner, Admin, Staff for their clients).
  - name: portal
    description: The signed-in client, on their firm's portal.

paths:
  /business/clients/{clientId}/documents:
    get:
      tags: [firm]
      operationId: listDocuments
      summary: The client's documents, newest first
      parameters:
        - { $ref: '#/components/parameters/ClientId' }
        - { name: query, in: query, schema: { $ref: '#/components/schemas/ListFirmDocumentsQuery' } }
      responses:
        '200': { $ref: '#/components/responses/FirmDocumentList' }
        '400': { description: 'VALIDATION_FAILED, for example a search with NUL, another control character or a lone surrogate' }
        '404': { $ref: '#/components/responses/NotFound' }
  /business/clients/{clientId}/documents/uploads:
    post:
      tags: [firm]
      operationId: createFirmUpload
      summary: Step 1 of an upload by the firm
      parameters: [{ $ref: '#/components/parameters/ClientId' }]
      requestBody: { $ref: '#/components/requestBodies/CreateFirmUploadRequest' }
      responses:
        '200': { $ref: '#/components/responses/UploadTicket' }
        '409': { description: NO_OPEN_SERVICE or CATEGORY_ARCHIVED }
        '404': { $ref: '#/components/responses/NotFound' }
  /business/documents/uploads/confirm:
    post:
      tags: [firm]
      operationId: confirmFirmUpload
      summary: Step 3; saves the document and starts the scan
      requestBody: { $ref: '#/components/requestBodies/ConfirmUploadRequest' }
      responses:
        '200': { description: FirmDocument }
        '409': { description: 'UPLOAD_MISMATCH, FILE_PASSWORD_PROTECTED or FILE_HAS_MACROS' }
        '503': { description: 'SERVICE_UNAVAILABLE, with Retry-After: storage failed or is busy; nothing is deleted' }
        '410': { description: UPLOAD_EXPIRED }
  /business/documents/{id}:
    get:
      tags: [firm]
      operationId: getDocument
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: FirmDocument }
        '404': { $ref: '#/components/responses/NotFound' }
  /business/documents/{id}/download:
    get:
      tags: [firm]
      operationId: downloadDocument
      summary: A 5-minute download link, for a CLEAN file only
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/DownloadLink' }
        '409': { description: SCAN_PENDING or FILE_BLOCKED }
        '503': { description: 'SERVICE_UNAVAILABLE, with Retry-After: storage failed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /business/document-categories:
    get:
      tags: [firm]
      operationId: listDocumentCategories
      summary: The firm's categories in order, archived ones too
      responses:
        '200': { description: DocumentCategoryList }
  /business/clients/{clientId}/document-requests:
    get:
      tags: [firm]
      operationId: listDocumentRequests
      parameters:
        - { $ref: '#/components/parameters/ClientId' }
        - { name: query, in: query, schema: { $ref: '#/components/schemas/ListDocumentRequestsQuery' } }
      responses:
        '200': { description: 'FirmDocumentRequestList, newest first' }
    post:
      tags: [firm]
      operationId: createDocumentRequest
      summary: Request a document (the client gets a bell and an email, no content)
      parameters: [{ $ref: '#/components/parameters/ClientId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateDocumentRequestRequest' } } }
      responses:
        '200': { description: FirmDocumentRequest }
        '409': { description: NO_OPEN_SERVICE or CATEGORY_ARCHIVED }
        '404': { $ref: '#/components/responses/NotFound' }
  /business/document-requests/{id}/accept:
    post:
      tags: [firm]
      operationId: acceptDocumentRequest
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: FirmDocumentRequest }
        '409': { description: 'NOTHING_SUBMITTED, SCAN_PENDING or REQUEST_CLOSED' }
        '404': { $ref: '#/components/responses/NotFound' }
  /business/document-requests/{id}/reject:
    post:
      tags: [firm]
      operationId: rejectDocumentRequest
      summary: Mark missing; the reason goes to the client, who is asked again
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RejectDocumentRequestRequest' } } }
      responses:
        '200': { description: FirmDocumentRequest }
        '409': { description: NOTHING_SUBMITTED or REQUEST_CLOSED }
        '404': { $ref: '#/components/responses/NotFound' }
  /business/document-requests/{id}/cancel:
    post:
      tags: [firm]
      operationId: cancelDocumentRequest
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: FirmDocumentRequest }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: REQUEST_CLOSED }

  /portal/{firmSlug}/me/documents:
    get:
      tags: [portal]
      operationId: listMyDocuments
      summary: The client's own (MINE) or the firm's shared (FIRM) documents; never INTERNAL
      parameters:
        - { $ref: '#/components/parameters/FirmSlug' }
        - { name: query, in: query, schema: { $ref: '#/components/schemas/ListMyDocumentsQuery' } }
      responses:
        '200': { description: MyDocumentList }
        '400': { description: 'VALIDATION_FAILED, for example a search with NUL, another control character or a lone surrogate' }
  /portal/{firmSlug}/me/documents/{id}:
    get:
      tags: [portal]
      operationId: getMyDocument
      parameters: [{ $ref: '#/components/parameters/FirmSlug' }, { $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: MyDocument }
        '404': { $ref: '#/components/responses/NotFound' }
  /portal/{firmSlug}/me/documents/{id}/download:
    get:
      tags: [portal]
      operationId: downloadMyDocument
      summary: A 5-minute download link, for a CLEAN file only
      parameters: [{ $ref: '#/components/parameters/FirmSlug' }, { $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/DownloadLink' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: SCAN_PENDING or FILE_BLOCKED }
        '503': { description: 'SERVICE_UNAVAILABLE, with Retry-After: storage failed' }
  /portal/{firmSlug}/me/documents/upload-targets:
    get:
      tags: [portal]
      operationId: myUploadTargets
      summary: The open tax and business services the Upload Documents pop-up may offer
      parameters: [{ $ref: '#/components/parameters/FirmSlug' }]
      responses:
        '200': { description: UploadTargets (empty lists are the STOP state) }
  /portal/{firmSlug}/me/documents/uploads:
    post:
      tags: [portal]
      operationId: createMyUpload
      summary: Step 1 of the client's upload; a requestId answers that request
      parameters: [{ $ref: '#/components/parameters/FirmSlug' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateMyUploadRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/UploadTicket' }
        '403': { description: 'FORBIDDEN: an AUTHORIZED login without a requestId' }
        '409': { description: 'NO_OPEN_SERVICE, REQUEST_CLOSED or CATEGORY_ARCHIVED' }
        '404': { $ref: '#/components/responses/NotFound' }
  /portal/{firmSlug}/me/documents/uploads/confirm:
    post:
      tags: [portal]
      operationId: confirmMyUpload
      parameters: [{ $ref: '#/components/parameters/FirmSlug' }]
      requestBody: { $ref: '#/components/requestBodies/ConfirmUploadRequest' }
      responses:
        '200': { description: MyDocument (status CHECKING) }
        '403': { description: 'FORBIDDEN: the login is AUTHORIZED now and the upload has no request' }
        '409': { description: 'UPLOAD_MISMATCH, FILE_PASSWORD_PROTECTED, FILE_HAS_MACROS, NO_OPEN_SERVICE, REQUEST_CLOSED or CATEGORY_ARCHIVED' }
        '503': { description: 'SERVICE_UNAVAILABLE, with Retry-After: storage failed or is busy; nothing is deleted' }
        '410': { description: UPLOAD_EXPIRED }
  /portal/{firmSlug}/me/document-categories:
    get:
      tags: [portal]
      operationId: myDocumentCategories
      parameters: [{ $ref: '#/components/parameters/FirmSlug' }]
      responses:
        '200': { description: 'MyDocumentCategoryList (active categories, in order)' }
  /portal/{firmSlug}/me/document-requests:
    get:
      tags: [portal]
      operationId: myDocumentRequests
      summary: The client's requests, open ones first (cancelled ones left out)
      parameters: [{ $ref: '#/components/parameters/FirmSlug' }]
      responses:
        '200': { description: MyDocumentRequestList }
  /portal/{firmSlug}/me/document-requests/{id}/not-available:
    post:
      tags: [portal]
      operationId: myDocumentNotAvailable
      summary: The client's "I don't have this", with their reason
      parameters: [{ $ref: '#/components/parameters/FirmSlug' }, { $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NotAvailableRequest' } } }
      responses:
        '200': { description: MyDocumentRequest }
        '403': { description: 'FORBIDDEN: an AUTHORIZED login' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'NO_OPEN_SERVICE (an archived client) or REQUEST_CLOSED' }

components:
  parameters:
    ClientId: { name: clientId, in: path, required: true, schema: { type: string, format: uuid } }
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    FirmSlug:
      name: firmSlug
      in: path
      required: true
      description: The firm's portal slug, for example `lvp`.
      schema: { type: string }
  requestBodies:
    CreateFirmUploadRequest:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/CreateFirmUploadRequest' } } }
    ConfirmUploadRequest:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ConfirmUploadRequest' } } }
  responses:
    NotFound: { description: NOT_FOUND (also for another firm's or another client's records) }
    UploadTicket: { description: UploadTicket }
    DownloadLink: { description: DownloadLink (url and expiresAt, 5 minutes) }
    FirmDocumentList: { description: FirmDocumentList (items, nextCursor, years) }
  schemas:
    # Shapes are the zod schemas of the same name in packages/types/src/documents/schemas.ts.
    ListFirmDocumentsQuery: { type: object, description: 'zod ListFirmDocumentsQuery' }
    CreateFirmUploadRequest: { type: object, description: 'zod CreateFirmUploadRequest' }
    ConfirmUploadRequest: { type: object, description: 'zod ConfirmUploadRequest' }
    ListDocumentRequestsQuery: { type: object, description: 'zod ListDocumentRequestsQuery' }
    CreateDocumentRequestRequest: { type: object, description: 'zod CreateDocumentRequestRequest' }
    RejectDocumentRequestRequest: { type: object, description: 'zod RejectDocumentRequestRequest' }
    ListMyDocumentsQuery: { type: object, description: 'zod ListMyDocumentsQuery' }
    CreateMyUploadRequest: { type: object, description: 'zod CreateMyUploadRequest' }
    NotAvailableRequest: { type: object, description: 'zod NotAvailableRequest' }
