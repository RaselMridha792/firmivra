openapi: 3.1.0
info:
  title: Firmivra intake agreements API
  version: 0.1.0
  description: |
    The firm's intake agreements (Settings > Terms & Privacy > Agreements) and the block a
    visitor or client signs before an intake submits (Begin Online and the portal intake tab).
    R14, from Rasel's decision 3 (Oct 8); the tables are #155's (`firm_agreements`,
    `firm_agreement_versions`, `firm_agreement_files`, `intake_signatures`,
    `intake_signature_agreements`).

    **Source of truth:** the zod schemas in `packages/types/src/agreements/schemas.ts` and the
    signature capture in `packages/types/src/esign/capture.ts`, with typed calls in
    `createAgreementsClient`, `createPublicAgreementsClient` and `createMyIntakeAgreementsClient`
    (web: `api.agreements`, `api.publicAgreements(slug)` and `api.myIntakeAgreements(slug)`). Mock mode: `apps/web/src/mocks/agreements.ts`. If this file and
    the zod schemas differ, the zod schemas win.

    ## Pages and calls

    | Page | Calls |
    | --- | --- |
    | Settings > Agreements (list) | `list` (agreements, plus the firm's services to pick from), `create`, `archive` |
    | Agreement editor | `get`, `getVersion`, `publish`; the PDF with `uploadFile()` (`createUpload`, PUT, `confirmUpload`), then `file` until CLEAN, `download` |
    | Begin Online, review step | `publicAgreements(slug).block({ form })`, `downloadPdf(agreementId, version)` |
    | Portal intake, review step | `myIntakeAgreements(slug).block(intakeId)`, `publicAgreements(slug).downloadPdf(agreementId, version)` |
    | Intake submit (R11) | `signature: IntakeSignatureInput` in the submit body; Begin Online picks its service and form only through `beginOnlineService(tx, form)`, the block's own lookup |

    - **Who:** firm routes are for the Owner and Admin (`401` signed out, `403 FORBIDDEN` for
      staff) and work while the firm is Pending Setup. Public routes need no sign-in; the firm
      comes from the slug, and an unknown or inactive firm, a form the firm does not offer,
      another firm's agreement, or an archived agreement answers `404`. The portal intake route
      needs the client's sign-in; another client's or firm's intake answers `404`.
    - **The block:** Begin Online asks with `?form=<IntakeFormKey>`; the API resolves the firm's
      unarchived Begin Online service of that kind (none: `404`) and answers the firm-wide
      agreement, then that service's published, unarchived agreements (sort order, then
      creation). "The Begin Online service" is the firm's unarchived service of that kind marked
      `begin_online` (at most one per kind); a service not marked answers `404`. The portal intake asks
      by intake id and the API uses the intake's form's service (`intakes.form_id ->
      intake_forms.service_id`, what #155's checks use), not a lookup by kind. Begin Online's submit must resolve its service and form only through
      `beginOnlineService(tx, form)` (agreements.service.ts), so the signed set matches the block;
      any other choice gives a firm with two services of one kind `409 AGREEMENT_OUTDATED`. `legal` is null unless the firm has published both Terms and Privacy, and always
      null on the portal route.
    - **Series and versions:** each firm has one firm-wide agreement (`ALL_INTAKES`) and up to 9
      unarchived service agreements per service (`SERVICE`; a 10th answers `409
      SERVICE_AGREEMENT_LIMIT`), so a signature holds at most 10. Versions are numbered from 1
      (at most 2,147,483,647) and never edited or deleted; `effectiveDate` is display only (a
      new version is current from the moment it is published). `expectedCurrentVersion` guards against two people publishing
      at once (`409 VERSION_CONFLICT`). The firm-wide agreement needs at least one required
      acknowledgment and can't be archived (`409 FIRM_WIDE_REQUIRED`).
    - **PDF original:** with `AGREEMENT_PDF_REQUIRED` on (off by default until uploads and scans work end to end on dev) each version needs a PDF whose
      scan is CLEAN (`409 PDF_REQUIRED`, `FILE_NOT_READY`, `FILE_BLOCKED`). `PDF_REQUIRED` is a
      publish code only: a submit never answers it (the signature sends nothing for the PDF; the
      API pins the version's `pdf_sha256`). `createUpload` takes `uploadFile()`'s facts with
      `contentType: application/pdf`. PDF only, 10 MB and 200 pages at most, no password
      (`409 NOT_A_PDF`, `FILE_PASSWORD_PROTECTED`, `TOO_MANY_PAGES`, `UPLOAD_MISMATCH`).
      Downloads are 5-minute attachment links. The public PDF route serves the current version
      only.
    - **Signing:** the signer reads every agreement in the block, ticks the required boxes, prints
      a name and types it again as the signature (`SignatureCaptureInput`). The API records the
      versions, their text and PDF SHA-256 values, the ticked boxes with their text, the
      database's time, the IP and user agent, and an evidence SHA-256 (`IntakeSignatureSummary`).
      Submit codes (`INTAKE_SIGNING_ERRORS`, which R11's error maps include): `409
      NO_INTAKE_AGREEMENT` (no published firm-wide version), `409 AGREEMENT_OUTDATED` (a newer
      version; `details` is `AgreementOutdatedDetails`, the current block, though
      `ApiRequestError` keeps no `details` yet, so screens reload the block), `400
      ACKNOWLEDGMENT_REQUIRED` (a required box not ticked), `400 SIGNATURE_MISMATCH` (the
      database's name comparison differs, e.g. a no-break space; the API maps the
      `intake_signatures_typed_matches` check to it, never a 500) and `409 TERMS_OUTDATED`
      (Begin Online: Terms or Privacy changed). Any other difference from the current
      set also answers `409 AGREEMENT_OUTDATED`: an agreement added or archived since the block
      loaded, one for another service, or the same version with another `bodySha256`. An
      unknown acknowledgment key answers `400 VALIDATION_FAILED`. The API checks these before
      #155's CHECKs, so none becomes a 500. Each ticked box is listed once and belongs to a
      signed agreement (`400 VALIDATION_FAILED`). `acceptLegal` is required on Begin Online when
      the block's `legal` is set and refused on a portal submit (`400 VALIDATION_FAILED`).
    - **Text:** titles and acknowledgment labels are one line; acknowledgment text and the
      Markdown body may have line breaks. None may hold control characters (but tab and line
      breaks in multi-line text), lone surrogates or bidi overrides (`400`, never a 500).
    - **Rendering:** the block is served to signed-out visitors on the portal origin every firm
      shares, so the renderer is the only wall. Agreement text is Markdown rendered with raw
      HTML off, images off, and links only to `https:` and `mailto:` (others render as text).
      Never `dangerouslySetInnerHTML`. R14 builds `<Markdown>` in packages/ui (branch
      `rasel/R14-markdown`, pending); screens use only that component.
    - **Writes:** JSON bodies from the app site only (`415`, `403 ORIGIN_NOT_ALLOWED`).
    - **Audit:** publish, archive and upload are logged with ids and version numbers, never the
      text; a signature is logged with its id and versions, never the name, IP or user agent.

servers:
  - url: /api/v1

security: [{ firmCookie: [] }]

tags:
  - name: agreements
  - name: agreement-files
  - name: public

paths:
  /business/agreements:
    parameters: [{ $ref: './client-auth.yaml#/components/parameters/BusinessId' }]
    get:
      tags: [agreements]
      operationId: listAgreements
      summary: The firm-wide agreement first, then service agreements by sort order
      responses:
        '200': { $ref: '#/components/responses/FirmAgreementList' }
        '401': { $ref: './settings.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './settings.yaml#/components/responses/Forbidden' }
    post:
      tags: [agreements]
      operationId: createAgreement
      summary: A new series (no version yet)
      requestBody: { $ref: '#/components/requestBodies/CreateAgreementRequest' }
      responses:
        '201': { $ref: '#/components/responses/FirmAgreementSummary' }
        '400': { $ref: './settings.yaml#/components/responses/ValidationFailed' }
        '401': { $ref: './settings.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './settings.yaml#/components/responses/Forbidden' }
        '404': { $ref: './settings.yaml#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AgreementConflict' }

  /business/agreements/{agreementId}:
    parameters:
      - { $ref: './client-auth.yaml#/components/parameters/BusinessId' }
      - { $ref: '#/components/parameters/AgreementId' }
    get:
      tags: [agreements]
      operationId: getAgreement
      summary: The series with every version, newest first
      responses:
        '200': { $ref: '#/components/responses/FirmAgreementDetail' }
        '401': { $ref: './settings.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './settings.yaml#/components/responses/Forbidden' }
        '404': { $ref: './settings.yaml#/components/responses/NotFound' }

  /business/agreements/{agreementId}/versions:
    parameters:
      - { $ref: './client-auth.yaml#/components/parameters/BusinessId' }
      - { $ref: '#/components/parameters/AgreementId' }
    post:
      tags: [agreements]
      operationId: publishAgreementVersion
      summary: Publish the next version
      requestBody: { $ref: '#/components/requestBodies/PublishAgreementVersionRequest' }
      responses:
        '201': { $ref: '#/components/responses/AgreementVersion' }
        '400': { $ref: './settings.yaml#/components/responses/ValidationFailed' }
        '401': { $ref: './settings.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './settings.yaml#/components/responses/Forbidden' }
        '404': { $ref: './settings.yaml#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AgreementConflict' }

  /business/agreements/{agreementId}/versions/{version}:
    parameters:
      - { $ref: './client-auth.yaml#/components/parameters/BusinessId' }
      - { $ref: '#/components/parameters/AgreementId' }
      - { $ref: '#/components/parameters/Version' }
    get:
      tags: [agreements]
      operationId: getAgreementVersion
      summary: One version in full
      responses:
        '200': { $ref: '#/components/responses/AgreementVersion' }
        '401': { $ref: './settings.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './settings.yaml#/components/responses/Forbidden' }
        '404': { $ref: './settings.yaml#/components/responses/NotFound' }

  /business/agreements/{agreementId}/archive:
    parameters:
      - { $ref: './client-auth.yaml#/components/parameters/BusinessId' }
      - { $ref: '#/components/parameters/AgreementId' }
    post:
      tags: [agreements]
      operationId: archiveAgreement
      summary: Archive a service agreement (no body; repeating changes nothing)
      responses:
        '200': { $ref: '#/components/responses/FirmAgreementSummary' }
        '401': { $ref: './settings.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './settings.yaml#/components/responses/Forbidden' }
        '404': { $ref: './settings.yaml#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AgreementConflict' }

  /business/agreements/files/uploads:
    parameters: [{ $ref: './client-auth.yaml#/components/parameters/BusinessId' }]
    post:
      tags: [agreement-files]
      operationId: createAgreementUpload
      summary: Step 1 of 3, a one-time PUT URL for the PDF (240 seconds)
      requestBody: { $ref: '#/components/requestBodies/CreateAgreementUploadRequest' }
      responses:
        '201': { $ref: './documents.yaml#/components/responses/UploadTicket' }
        '400': { $ref: './settings.yaml#/components/responses/ValidationFailed' }
        '401': { $ref: './settings.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './settings.yaml#/components/responses/Forbidden' }

  /business/agreements/files/confirm:
    parameters: [{ $ref: './client-auth.yaml#/components/parameters/BusinessId' }]
    post:
      tags: [agreement-files]
      operationId: confirmAgreementUpload
      summary: Step 3 of 3, checks the stored PDF and starts the scan
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: './documents.yaml#/components/schemas/ConfirmUploadRequest' } } }
      responses:
        '201': { $ref: '#/components/responses/AgreementFile' }
        '400': { $ref: './settings.yaml#/components/responses/ValidationFailed' }
        '401': { $ref: './settings.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './settings.yaml#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AgreementConflict' }
        '410': { $ref: '#/components/responses/AgreementConflict' }
        '503': { description: 'SERVICE_UNAVAILABLE, with Retry-After: storage failed, or 4 checks are already running; nothing is deleted' }

  /business/agreements/files/{fileId}:
    parameters:
      - { $ref: './client-auth.yaml#/components/parameters/BusinessId' }
      - { $ref: '#/components/parameters/FileId' }
    get:
      tags: [agreement-files]
      operationId: getAgreementFile
      summary: The file and its scan (poll until CLEAN)
      responses:
        '200': { $ref: '#/components/responses/AgreementFile' }
        '401': { $ref: './settings.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './settings.yaml#/components/responses/Forbidden' }
        '404': { $ref: './settings.yaml#/components/responses/NotFound' }

  /business/agreements/files/{fileId}/download:
    parameters:
      - { $ref: './client-auth.yaml#/components/parameters/BusinessId' }
      - { $ref: '#/components/parameters/FileId' }
    get:
      tags: [agreement-files]
      operationId: downloadAgreementFile
      summary: A 5-minute attachment link to a CLEAN file
      responses:
        '200': { $ref: '#/components/responses/DownloadLink' }
        '401': { $ref: './settings.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './settings.yaml#/components/responses/Forbidden' }
        '404': { $ref: './settings.yaml#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AgreementConflict' }

  /portal/{firmSlug}/intake-agreements:
    parameters:
      - { $ref: '#/components/parameters/FirmSlug' }
      - name: form
        in: query
        required: true
        description: The Begin Online form (`IntakeFormKey`, e.g. `BOOKKEEPING`)
        schema:
          type: string
          enum: [ANNUAL_TAX, QUARTERLY_TAX, BOOKKEEPING, PAYROLL, TAX_PLANNING, BUSINESS_DEVELOPMENT]
    get:
      tags: [public]
      security: []
      operationId: getIntakeAgreementBlock
      summary: The agreements a Begin Online visitor signs for a form (the firm-wide one first)
      responses:
        '200':
          description: IntakeAgreementBlock
          content: { application/json: { schema: { $ref: '#/components/schemas/IntakeAgreementBlock' } } }
        '400': { $ref: './settings.yaml#/components/responses/ValidationFailed' }
        '404': { $ref: './settings.yaml#/components/responses/NotFound' }

  /portal/{firmSlug}/me/intakes/{intakeId}/agreements:
    parameters:
      - { $ref: '#/components/parameters/FirmSlug' }
      - { name: intakeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [public]
      security: [{ portalCookie: [] }]
      operationId: getMyIntakeAgreementBlock
      summary: The agreements the signed-in client signs for one of their intakes (legal is null)
      responses:
        '200':
          description: IntakeAgreementBlock
          content: { application/json: { schema: { $ref: '#/components/schemas/IntakeAgreementBlock' } } }
        '400': { $ref: './settings.yaml#/components/responses/ValidationFailed' }
        '401': { $ref: './settings.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: './settings.yaml#/components/responses/NotFound' }

  /portal/{firmSlug}/intake-agreements/{agreementId}/versions/{version}/pdf:
    parameters:
      - { $ref: '#/components/parameters/FirmSlug' }
      - { $ref: '#/components/parameters/AgreementId' }
      - { $ref: '#/components/parameters/Version' }
    get:
      tags: [public]
      security: []
      operationId: downloadIntakeAgreementPdf
      summary: The current version's PDF original (an older version answers 404)
      description: |
        Any current, unarchived agreement of the firm, a service one included, whether or not its
        service is marked Begin Online: the portal intake signs those too. Intended.
      responses:
        '200': { $ref: '#/components/responses/DownloadLink' }
        '400': { $ref: './settings.yaml#/components/responses/ValidationFailed' }
        '404': { $ref: './settings.yaml#/components/responses/NotFound' }
        '409': { description: 'FILE_BLOCKED: the stored file is no longer the confirmed one' }
        '503': { description: 'SERVICE_UNAVAILABLE, with Retry-After: storage failed' }

components:
  securitySchemes:
    firmCookie: { type: apiKey, in: cookie, name: fv_access }
    portalCookie: { type: apiKey, in: cookie, name: 'fv_portal_{slug}_access', description: The firm's portal access cookie (client-auth.yaml) }
  parameters:
    AgreementId: { name: agreementId, in: path, required: true, schema: { type: string, format: uuid } }
    FileId: { name: fileId, in: path, required: true, schema: { type: string, format: uuid } }
    Version: { name: version, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 2147483647 } }
    FirmSlug: { name: firmSlug, in: path, required: true, schema: { type: string } }
  requestBodies:
    CreateAgreementRequest:
      required: true
      content: { application/json: { schema: { type: object, description: 'zod CreateAgreementRequest' } } }
    PublishAgreementVersionRequest:
      required: true
      content: { application/json: { schema: { type: object, description: 'zod PublishAgreementVersionRequest' } } }
    CreateAgreementUploadRequest:
      required: true
      content: { application/json: { schema: { type: object, description: 'zod CreateAgreementUploadRequest' } } }
  responses:
    FirmAgreementList:
      description: FirmAgreementList
      content: { application/json: { schema: { type: object, description: 'zod FirmAgreementList' } } }
    FirmAgreementSummary:
      description: FirmAgreementSummary
      content: { application/json: { schema: { type: object, description: 'zod FirmAgreementSummary' } } }
    FirmAgreementDetail:
      description: FirmAgreementDetail
      content: { application/json: { schema: { type: object, description: 'zod FirmAgreementDetail' } } }
    AgreementVersion:
      description: AgreementVersion
      content: { application/json: { schema: { type: object, description: 'zod AgreementVersion' } } }
    AgreementFile:
      description: AgreementFile
      content: { application/json: { schema: { type: object, description: 'zod AgreementFile' } } }
    DownloadLink: { $ref: './documents.yaml#/components/responses/DownloadLink' }
    AgreementConflict:
      description: 'An `AgreementErrorCode` (see AGREEMENT_ERRORS for the text users see)'
      content: { application/json: { schema: { $ref: './client-auth.yaml#/components/schemas/ApiError' } } }
  schemas:
    IntakeAgreementBlock: { type: object, description: 'zod IntakeAgreementBlock' }
    IntakeSignatureInput:
      type: object
      description: 'zod IntakeSignatureInput: `signature` in the intake submit bodies (R11)'
    AgreementOutdatedDetails: { type: object, description: 'zod AgreementOutdatedDetails (the current IntakeAgreementBlock)' }
    IntakeSignatureSummary:
      type: object
      description: 'zod IntakeSignatureSummary: the signature on a submitted intake (R11 detail views)'
