          content: { application/json: { schema: { $ref: '#/components/schemas/Zod' } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /esign/in-person/exit:
    post:
      tags: [esign-extras]
      operationId: exitEsignInPerson
      summary: "Unlock with the staff password (`ExitEsignInPersonBody` → `OkResponse`); allowed while locked. 400 PASSWORD_WRONG; 401 after 5 wrong"
      requestBody: { $ref: '#/components/requestBodies/Zod' }
      responses:
        '200':
          description: The zod schema in the summary
          content: { application/json: { schema: { $ref: '#/components/schemas/Zod' } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /esign/roles:
    get:
      tags: [esign-extras]
      operationId: listEsignRoles
      summary: "Every active member’s Firm Sign access, Owner and Admin only (→ `EsignMemberRoleList`)"
      responses:
        '200':
          description: The zod schema in the summary
          content: { application/json: { schema: { $ref: '#/components/schemas/Zod' } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /esign/roles/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [esign-extras]
      operationId: setEsignRole
      summary: "A Staff member’s Firm Sign access (`SetEsignMemberRoleBody` → `EsignMemberRole`). 409 ROLE_FIXED, NOT_A_MEMBER"
      requestBody: { $ref: '#/components/requestBodies/Zod' }
      responses:
        '200':
          description: The zod schema in the summary
          content: { application/json: { schema: { $ref: '#/components/schemas/Zod' } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /esign/templates/{templateId}/versions:
    parameters:
      - { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [esign-extras]
      operationId: listEsignTemplateVersions
      summary: "Every saved version, newest first (→ `EsignTemplateVersionList`)"
      responses:
        '200':
          description: The zod schema in the summary
          content: { application/json: { schema: { $ref: '#/components/schemas/Zod' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /esign/templates/{templateId}/versions/{version}/restore:
    parameters:
      - { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      tags: [esign-extras]
      operationId: restoreEsignTemplateVersion
      summary: "Copies an older version into a new newest one (`RestoreEsignTemplateVersionBody` → `EsignTemplateDetail`). 409 TEMPLATE_ARCHIVED"
      requestBody: { $ref: '#/components/requestBodies/Zod' }
      responses:
        '200':
          description: The zod schema in the summary
          content: { application/json: { schema: { $ref: '#/components/schemas/Zod' } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /esign/templates/{templateId}/duplicate:
    parameters:
      - { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [esign-extras]
      operationId: duplicateEsignTemplate
      summary: "A copy the caller owns, at version 1 (`DuplicateEsignTemplateBody` → `EsignTemplateDetail`). 409 TEMPLATE_NAME_TAKEN"
      requestBody: { $ref: '#/components/requestBodies/Zod' }
      responses:
        '200':
          description: The zod schema in the summary
          content: { application/json: { schema: { $ref: '#/components/schemas/Zod' } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /esign/templates/{templateId}/bulk-send:
    parameters:
      - { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [esign-extras]
      operationId: bulkSendEsignTemplate
      summary: "One separate request per client (`EsignBulkSendBody` → 202 `EsignBulkBatch`). 400 BULK_LIMIT; 409 TEMPLATE_ARCHIVED, TEMPLATE_ROLES_UNFILLED"
      requestBody: { $ref: '#/components/requestBodies/Zod' }
      responses:
        '202':
          description: The zod schema in the summary
          content: { application/json: { schema: { $ref: '#/components/schemas/Zod' } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /esign/bulk/{batchId}:
    parameters:
      - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [esign-extras]
      operationId: getEsignBulkBatch
      summary: "A bulk send’s rows (→ `EsignBulkBatch`)"
      responses:
        '200':
          description: The zod schema in the summary
          content: { application/json: { schema: { $ref: '#/components/schemas/Zod' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /esign/reports:
    parameters:
      - { name: from, in: query, required: true, schema: { type: string, format: date } }
      - { name: to, in: query, required: true, schema: { type: string, format: date } }
      - { name: status, in: query, schema: { $ref: '#/components/schemas/EsignRequestStatus' } }
      - { name: senderId, in: query, schema: { type: string, format: uuid } }
    get:
      tags: [esign-extras]
      operationId: getEsignReport
      summary: "Totals and activity by sender for requests sent in a range of at most a year (`EsignReportQuery` → `EsignReport`)"
      responses:
        '200':
          description: The zod schema in the summary
          content: { application/json: { schema: { $ref: '#/components/schemas/Zod' } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  parameters:
    RequestId:
      name: id
      in: path
      required: true
      description: The request id (`EsignRequestRow.id`)
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      description: The request's file (`EsignDocument.id`)
      schema: { type: string, format: uuid }

  securitySchemes:
    firmCookie: { type: apiKey, in: cookie, name: fv_access }
    portalCookie: { type: apiKey, in: cookie, name: 'fv_portal_{slug}_access' }
    signerCookie: { type: apiKey, in: cookie, name: 'fv_sign_{slug}' }

  requestBodies:
    Zod:
      required: true
      description: The zod schema named in the summary (packages/types/src/esign/schemas.ts)
      content: { application/json: { schema: { $ref: '#/components/schemas/Zod' } } }

  responses:
    Detail:
      description: '`EsignRequestDetail` after the call'
      content: { application/json: { schema: { $ref: '#/components/schemas/Zod' } } }
    Document:
      description: '`EsignDocument`'
      content: { application/json: { schema: { $ref: '#/components/schemas/Zod' } } }
    Ok:
      description: '`{ ok: true }`'
      content: { application/json: { schema: { $ref: '#/components/schemas/Zod' } } }
    ValidationFailed:
      description: '`VALIDATION_FAILED`: bad input, an unknown field, an unknown recipient, field or page'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Unauthenticated:
      description: '`UNAUTHENTICATED`: not signed in'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Forbidden:
      description: '`MODULE_OFF` (Firm Sign is off; mock: `NEXT_PUBLIC_API_MOCK_ESIGN=off`), `FORBIDDEN` (a Viewer changing something) or `ORIGIN_NOT_ALLOWED`'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    NotFound:
      description: '`NOT_FOUND`: no such request, file, recipient or client, or one the caller may not see'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    TooMany:
      description: '`CODE_LOCKED`, `CODE_TOO_SOON` or `RATE_LIMITED`'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Conflict:
      description: 'See `EsignErrorCode`: `INVALID_STATE`, `REQUEST_CLOSED`, `NOT_READY`, `PDF_ENCRYPTED`, `PDF_UNREADABLE`, `TOO_MANY_PAGES`, `SCAN_PENDING`, `FILE_BLOCKED`, `FILE_TYPE_NOT_ALLOWED`, `UPLOAD_MISMATCH`, `ENGAGEMENT_MISMATCH`, `RECIPIENTS_LINKED`, `LOGIN_NOT_ACTIVE`, `NOT_A_MEMBER`, `PAGE_HAS_FIELDS`, `REMIND_TOO_SOON`, `RECIPIENT_DONE`'
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  schemas:
    ApiError: { $ref: './client-auth.yaml#/components/schemas/ApiError' }
    Zod:
      description: Defined by the zod schema named where it is used (packages/types/src/esign/schemas.ts)
      type: object
    EsignRequestStatus:
      type: string
      enum: [DRAFT, NEEDS_APPROVAL, SENT, DELIVERED, VIEWED, PARTIALLY_SIGNED, COMPLETED, DECLINED, EXPIRED, VOIDED]
    EsignStatus:
      type: object
      required: [enabled, myEsignRole]
      properties:
        enabled: { type: boolean }
        myEsignRole:
          oneOf:
            - { type: string, enum: [OWNER, ADMIN, MANAGER, STAFF, VIEWER] }
            - { type: 'null' }
    EsignRequestList:
      type: object
      required: [items, nextCursor]
      description: '`EsignRequestList`: rows are `EsignRequestRow` (title, status, client, sender, signer names and counts, next action, created, sent, last activity, expiry, completed)'
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Zod' } }
        nextCursor: { oneOf: [{ type: string }, { type: 'null' }] }
