components:
  securitySchemes:
    FirmCookie:
      type: apiKey
      in: cookie
      name: fv_access
    AdminCookie:
      type: apiKey
      in: cookie
      name: fv_admin_access
  schemas:
    Appointment:
      type: object
      additionalProperties: false
      required:
        - id
        - clientId
        - clientName
        - providerMembershipId
        - providerName
        - typeId
        - typeName
        - startsAt
        - endsAt
        - timezone
        - method
        - location
        - meetingUrl
        - instructions
        - status
        - version
        - createdAt
        - updatedAt
      properties:
        id: *a10
        clientId: *a10
        clientName:
          type: string
          maxLength: 200
          minLength: 1
        providerMembershipId: *a10
        providerName:
          type: string
          maxLength: 200
          minLength: 1
        typeId: *a10
        typeName:
          type: string
          maxLength: 120
          minLength: 1
        startsAt: *a12
        endsAt: *a12
        timezone:
          type: string
          maxLength: 100
          minLength: 1
        method: *a19
        location: *a26
        meetingUrl: *a27
        instructions: *a28
        status: *a17
        version:
          type: integer
          minimum: 1
        createdAt: *a12
        updatedAt: *a12
    AppointmentTypeInput:
      type: object
      additionalProperties: false
      required:
        - name
        - durationMinutes
        - bufferBeforeMinutes
        - bufferAfterMinutes
        - allowedMethods
        - clientBookingEnabled
        - active
      properties:
        name: &a30
          type: string
          maxLength: 120
          minLength: 1
        durationMinutes: &a31
          type: integer
          minimum: 1
          maximum: 480
        bufferBeforeMinutes: &a32
          type: integer
          minimum: 0
          maximum: 120
        bufferAfterMinutes: &a33
          type: integer
          minimum: 0
          maximum: 120
        allowedMethods: &a34
          type: array
          items: *a19
          maxItems: 3
          uniqueItems: true
          minItems: 1
        clientBookingEnabled: &a29
          type: boolean
        active: *a29
        isIntroCall:
          type: boolean
          description: Explicit free introductory call classification; must be 5 minutes and PHONE only. Not
            inferred from display name.
          default: false
    AppointmentTypePatch:
      type: object
      additionalProperties: false
      properties:
        name: *a30
        durationMinutes: *a31
        bufferBeforeMinutes: *a32
        bufferAfterMinutes: *a33
        allowedMethods: *a34
        clientBookingEnabled: *a29
        active: *a29
        isIntroCall:
          type: boolean
          description: Explicit free introductory call classification; must be 5 minutes and PHONE only. Not
            inferred from display name.
      minProperties: 1
    AppointmentType:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - durationMinutes
        - bufferBeforeMinutes
        - bufferAfterMinutes
        - allowedMethods
        - clientBookingEnabled
        - active
        - createdAt
        - updatedAt
        - isIntroCall
      properties:
        id: *a10
        name: *a30
        durationMinutes: *a31
        bufferBeforeMinutes: *a32
        bufferAfterMinutes: *a33
        allowedMethods: *a34
        clientBookingEnabled: *a29
        active: *a29
        createdAt: *a12
        updatedAt: *a12
        isIntroCall:
          type: boolean
          description: Explicit free introductory call classification; must be 5 minutes and PHONE only. Not
            inferred from display name.
    WorkingHours:
      type: object
      additionalProperties: false
      required:
        - weekday
        - startMinute
        - endMinute
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
        startMinute:
          type: integer
          minimum: 0
          maximum: 1439
        endMinute:
          type: integer
          minimum: 1
          maximum: 1440
    BlockedTimeInput:
      type: object
      additionalProperties: false
      required:
        - providerMembershipId
        - startsAt
        - endsAt
        - reason
      properties:
        providerMembershipId: *a10
        startsAt: *a12
        endsAt: *a12
        reason: &a35
          type: string
          maxLength: 500
          nullable: true
    BlockedTime:
      type: object
      additionalProperties: false
      required:
        - id
        - providerMembershipId
        - startsAt
        - endsAt
        - reason
        - createdAt
      properties:
        id: *a10
        providerMembershipId: *a10
        startsAt: *a12
        endsAt: *a12
        reason: *a35
        createdAt: *a12
    AppointmentHistory:
      type: object
      additionalProperties: false
      required:
        - id
        - action
        - previousStartsAt
        - previousEndsAt
        - previousStatus
        - newStartsAt
        - newEndsAt
        - newStatus
        - createdAt
      properties:
        id: *a10
        action:
          type: string
          enum:
            - BOOKED
            - RESCHEDULED
            - CANCELLED
            - DETAILS_UPDATED
            - COMPLETED
            - NO_SHOW
        previousStartsAt:
          type: string
          format: date-time
          nullable: true
        previousEndsAt:
          type: string
          format: date-time
          nullable: true
        previousStatus:
          type: string
          enum: *a36
          nullable: true
        newStartsAt: *a12
        newEndsAt: *a12
        newStatus: *a17
        createdAt: *a12
