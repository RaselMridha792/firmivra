# Checks every pull request into main: format, lint, typecheck, test, build, in parallel jobs.
# A PR that changes only files in apps/, infra/ or docs/ checks only the packages it changed and
# their dependents; any other change (packages/, the lockfile, root config, CI itself) checks all.
# No AWS access: no id-token permission and no environment. The job named `ci` is the required
# status check: it waits for the others and fails unless they all passed.
# Actions are pinned to commit SHAs (public repo); the comment after each one is its release.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: format, lint, typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # pull_request checks out the PR merged into main: HEAD^1 is main, HEAD^2 the PR.
      - &scope
        name: Choose the packages to check
        run: |
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          if git rev-parse -q --verify HEAD^2 > /dev/null &&
            ! grep -qvE '^(apps|infra|docs)/' "$RUNNER_TEMP/changed.txt"; then
            echo 'FILTER=...[HEAD^1]' >> "$GITHUB_ENV"
            echo 'Only the changed packages and their dependents'
          else
            echo 'Every package'
          fi

      # Synthetic local settings, as in local setup.
      - run: cp .env.example .env

      # Turbo's local cache: unchanged packages replay their lint and typecheck results.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-checks-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-checks-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm format:check
      - run: pnpm lint ${FILTER:+"--filter=$FILTER"}
      - run: pnpm typecheck ${FILTER:+"--filter=$FILTER"}

  test:
    name: test (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        shard: [1, 2]
    timeout-minutes: 20
    services:
      # Same image, credentials and host port as docker-compose.yml, so .env.example works unchanged.
      # Docker's official postgres:16 from its ECR Public mirror: Docker Hub rate-limits CI's pulls.
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_DB: firmivra
          POSTGRES_USER: firmivra
          POSTGRES_PASSWORD: firmivra
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U firmivra -d firmivra"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - *scope

      # Synthetic local settings, as in local setup. The test configs load the root .env themselves.
      - run: cp .env.example .env

      # docker/postgres/init creates the API's role locally; a service container cannot mount repo files.
      - name: Create the app database role
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -U firmivra -d firmivra -v ON_ERROR_STOP=1 < docker/postgres/init/01-app-role.sql

      # Tests are never cached (turbo.json); this keeps the packages they build first.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-test-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-test-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Each shard runs every package's test files that vitest assigns to it; the two shards
      # together run the same tests as one full run.
      - run: pnpm test ${FILTER:+"--filter=$FILTER"} -- --shard="$SHARD"/2
        env:
          SHARD: ${{ matrix.shard }}

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - *scope

      # Synthetic local settings, as in local setup. The web build loads the root .env.
      - run: cp .env.example .env

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Next.js reuses its compiler cache when turbo has to rebuild the web app.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm build ${FILTER:+"--filter=$FILTER"}

  # The required status check. `always()` makes it run, and fail, when a job above failed or was
  # cancelled, instead of being skipped (a skipped required check would let the PR merge).
  ci:
    name: ci
    needs: [checks, test, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then exit 1; fi
          done
