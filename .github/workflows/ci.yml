# Checks every pull request into main: install, format, lint, typecheck, test, build.
# No AWS access: no id-token permission and no environment. The job name `ci` is the required status check.
# Actions are pinned to commit SHAs (public repo); the comment after each one is its release.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Same image, credentials and host port as docker-compose.yml, so .env.example works unchanged.
      # Docker's official postgres:16 from its ECR Public mirror: Docker Hub rate-limits CI's pulls.
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_DB: firmivra
          POSTGRES_USER: firmivra
          POSTGRES_PASSWORD: firmivra
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U firmivra -d firmivra"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      HUSKY: '0'
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Synthetic local settings, as in local setup. The test configs load the root .env themselves.
      - run: cp .env.example .env

      # docker/postgres/init creates the API's role locally; a service container cannot mount repo files.
      - name: Create the app database role
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -U firmivra -d firmivra -v ON_ERROR_STOP=1 < docker/postgres/init/01-app-role.sql

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
