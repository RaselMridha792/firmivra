# Deploys every push to main to dev: builds the api, web and migrate images, pushes them to ECR,
# runs the migration task, then rolls api and web to the new images and checks the three sites.
# AWS access only through the GitHub environment `dev` (main only) and the OIDC role
# firmivra-dev-github-deploy. The running image tags are parameters of firmivra-dev-app
# (ImageTag, MigrateImageTag); only this workflow sets them. Other stacks stay manual (diff, then yes).
# One job on purpose: each job with `environment: dev` is a GitHub deployment, and with three
# parallel image jobs GitHub held the extra deployments in "waiting" indefinitely (Oct 5 and 6).
# Actions are pinned to commit SHAs (public repo); the comment after each one is its release.
name: Deploy dev

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a rollout halfway.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::778127141557:role/firmivra-dev-github-deploy
  REGISTRY: 778127141557.dkr.ecr.us-east-1.amazonaws.com
  APP_STACK: firmivra-dev-app

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.sha }}
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: deploy-dev-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # ECR tags cannot be overwritten, so a re-run skips images this commit already pushed.
      - name: Find images to build
        id: missing
        run: |
          any=false
          for image in api web migrate; do
            count=$(aws ecr batch-get-image --repository-name "firmivra-dev-$image" \
              --image-ids imageTag="$TAG" --query 'length(images)' --output text)
            missing=$([ "$count" = 0 ] && echo true || echo false)
            [ "$missing" = true ] && any=true
            echo "$image=$missing" | tee -a "$GITHUB_OUTPUT"
          done
          echo "any=$any" >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        if: steps.missing.outputs.any == 'true'
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.missing.outputs.any == 'true'

      # One plain image per tag (no provenance or SBOM): ECR keeps the last 10 images, and
      # attestations would count too. Layers are cached in GitHub Actions per image.
      - name: Build and push api
        if: steps.missing.outputs.api == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/firmivra-dev-api:${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web
        if: steps.missing.outputs.web == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/firmivra-dev-web:${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build and push migrate
        if: steps.missing.outputs.migrate == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/db/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/firmivra-dev-migrate:${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

      # pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @firmivra/infra...

      # A fresh one-hour session for the deploy steps, after the image builds.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: deploy-dev-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # Template changes merged to main go live with this deploy; the diff stays in the log.
      - name: Show app stack changes
        working-directory: infra
        run: pnpm exec cdk diff "$APP_STACK" -c env=dev --exclusively --no-notices

      - name: Deploy the migration image
        working-directory: infra
        run: |
          pnpm exec cdk deploy "$APP_STACK" -c env=dev --exclusively --require-approval never \
            --progress events --no-notices --parameters "$APP_STACK:MigrateImageTag=$TAG"

      - name: Run the migration task
        run: |
          outputs=$(aws cloudformation describe-stacks --stack-name "$APP_STACK" --query 'Stacks[0].Outputs' --output json)
          out() { jq -r --arg k "$1" '.[] | select(.OutputKey == $k) | .OutputValue' <<< "$outputs"; }
          cluster=$(out ClusterName)
          task=$(aws ecs run-task --cluster "$cluster" --task-definition "$(out MigrateTaskDefinition)" \
            --capacity-provider-strategy capacityProvider=FARGATE,weight=1 \
            --network-configuration "awsvpcConfiguration={subnets=[$(out TaskSubnets)],securityGroups=[$(out MigrateSecurityGroup)],assignPublicIp=ENABLED}" \
            --started-by "deploy-dev-$GITHUB_RUN_ID" --query 'tasks[0].taskArn' --output text)
          if [[ "$task" != arn:* ]]; then echo "::error::The migration task did not start"; exit 1; fi
          echo "Migration task: $task"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task"
          result=$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task" --output json)
          code=$(jq -r '.tasks[0].containers[0].exitCode' <<< "$result")
          aws logs get-log-events --log-group-name "$(out MigrateLogGroup)" \
            --log-stream-name "migrate/migrate/${task##*/}" --start-from-head \
            --query 'events[].message' --output text || true
          if [ "$code" != 0 ]; then
            echo "::error::Migration failed (exit $code): $(jq -r '.tasks[0].stoppedReason' <<< "$result")"
            exit 1
          fi

      - name: Roll out api and web
        working-directory: infra
        run: |
          pnpm exec cdk deploy "$APP_STACK" -c env=dev --exclusively --require-approval never \
            --progress events --no-notices --parameters "$APP_STACK:ImageTag=$TAG"

      # The site URLs come from the stack outputs (infra config), not from this file.
      - name: Smoke test the three sites
        run: |
          outputs=$(aws cloudformation describe-stacks --stack-name "$APP_STACK" --query 'Stacks[0].Outputs' --output json)
          out() { jq -r --arg k "$1" '.[] | select(.OutputKey == $k) | .OutputValue' <<< "$outputs"; }
          admin=$(out AdminUrl) app=$(out AppUrl) portal=$(out PortalUrl)
          failed=0
          for url in "$admin/" "$app/" "$portal/lvp" \
            "$admin/api/v1/health" "$app/api/v1/health" "$portal/api/v1/health"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 20 --retry 6 --retry-delay 10 "$url" || true)
            echo "$code $url"
            [ "$code" = 200 ] || failed=1
          done
          { echo "Deployed \`$TAG\` to dev"; echo; echo "- $admin"; echo "- $app"; echo "- $portal/lvp"; } >> "$GITHUB_STEP_SUMMARY"
          exit $failed
