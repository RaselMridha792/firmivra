# Deploys a commit of main to prod: starts the database if prod is on hold, builds its api, web and
# migrate images, pushes them to ECR, runs the migration task, then rolls api and web to the new
# images and checks the three prod sites.
# Prod no longer follows main by itself (Rasel, Nov 17: prod on hold until dev is tested). It runs
# only when Rasel presses "Run workflow" (action deploy, ref main by default: the one-click resume)
# or pushes a v* tag (only Rasel creates them, CLAUDE.md).
# Hold (action hold): sets the app stack's ImageTag to "none", which takes api and web to 0 tasks
# and their auto scaling to 0 (the HasImage condition, as before the first release), then stops
# the database. It deletes nothing: the load balancer, CloudFront, Cognito, S3, KMS and DNS stay.
# AWS starts a stopped database again after 7 days; prod-hold-keeper.yml stops it again while
# ImageTag is "none". The next deploy is the resume: it starts the database and brings the tasks
# back to auto scaling's 2 to 6.
# AWS access only through the GitHub environment `prod` (deployments from main and v* tags) and the
# OIDC role firmivra-prod-github-deploy, which trusts that environment only. The running image tags
# are parameters of firmivra-prod-app (ImageTag, MigrateImageTag); only this workflow sets them.
# The other prod stacks stay manual (diff, then Rasel's yes), as in docs/work/R1-cicd.md, "Prod
# go-live checklist". The first deploy creates firmivra-prod-app itself, with no images (0 tasks),
# so its ECR repositories exist for the build.
# One deploy job on purpose, as in deploy-dev.yml: each job with an environment is a GitHub
# deployment. The plan job before it has no environment and no AWS access.
# Actions are pinned to commit SHAs (public repo); the comment after each one is its release.
name: Deploy prod

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      action:
        description: deploy (also the resume from a hold) or hold
        required: true
        default: deploy
        type: choice
        options: [deploy, hold]
      ref:
        description: The commit of main or v* tag to deploy (default main; a hold always uses main)
        required: true
        default: main
        type: string

permissions:
  contents: read

# One deploy at a time; a newer one waits instead of cancelling a rollout halfway.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::778127141557:role/firmivra-prod-github-deploy
  REGISTRY: 778127141557.dkr.ecr.us-east-1.amazonaws.com
  APP_STACK: firmivra-prod-app
  DB_INSTANCE: firmivra-prod-postgres

jobs:
  # Which commit, and deploy or hold. A manual run is Rasel's only.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.pick.outputs.go }}
      action: ${{ steps.pick.outputs.action }}
      sha: ${{ steps.pick.outputs.sha }}
      label: ${{ steps.pick.outputs.label }}
    steps:
      - name: Pick the commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_REF: ${{ inputs.ref }}
          ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          action=deploy
          case "$EVENT" in
            workflow_dispatch)
              if [ "$ACTOR" != "$OWNER" ]; then
                echo "::error::Only $OWNER runs Deploy prod by hand."
                exit 1
              fi
              action=${INPUT_ACTION:-deploy}
              ref=${INPUT_REF:-main}
              # A hold changes no images: it takes main's template with ImageTag "none".
              if [ "$action" = hold ]; then ref=main; fi
              sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref" --jq .sha) label="$ref (by hand)"
              ;;
            *)
              sha=$GITHUB_SHA label=$GITHUB_REF_NAME
              ;;
          esac
          echo "$action: $label ($sha)"
          { echo "go=true"; echo "action=$action"; echo "sha=$sha"; echo "label=$label"; } >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    if: needs.plan.outputs.go == 'true' && needs.plan.outputs.action == 'deploy'
    runs-on: ubuntu-24.04
    environment: prod
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.plan.outputs.sha }}
      LABEL: ${{ needs.plan.outputs.label }}
      HUSKY: '0'
    steps:
      # The chosen commit, with full history, so the next step can see main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Check that the commit is on main
        run: |
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error::$LABEL ($TAG) is not a commit of main. Deploy a merged commit."
            exit 1
          fi
          echo "$LABEL is $TAG on main"

      # pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @firmivra/infra...

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: deploy-prod-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # Resume from a hold: start the database now; the image build runs while it starts, and the
      # migration step waits for it.
      - name: Start the database if it is stopped
        run: |
          db() { aws rds describe-db-instances --db-instance-identifier "$DB_INSTANCE" \
            --query 'DBInstances[0].DBInstanceStatus' --output text; }
          status=$(db)
          # A stop still under way has to finish before a start is accepted.
          for _ in $(seq 1 60); do [ "$status" = stopping ] || break; sleep 20; status=$(db); done
          echo "Database: $status"
          if [ "$status" = stopped ]; then
            aws rds start-db-instance --db-instance-identifier "$DB_INSTANCE" \
              --query 'DBInstance.DBInstanceStatus' --output text
            echo "Prod was on hold: the database is starting." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The first deploy only: the app stack with no images (ImageTag and MigrateImageTag stay "none",
      # so 0 api and web tasks). Later deploys find it and go on; the steps below deploy their changes.
      - name: Create the empty app stack (first release)
        working-directory: infra
        run: |
          if status=$(aws cloudformation describe-stacks --stack-name "$APP_STACK" \
            --query 'Stacks[0].StackStatus' --output text 2>"$RUNNER_TEMP/describe.err"); then
            echo "$APP_STACK is $status"
            if [ "$status" = ROLLBACK_COMPLETE ]; then
              echo "::error::$APP_STACK failed to create; Rasel decides before the next deploy runs."
              exit 1
            fi
          elif grep -q 'does not exist' "$RUNNER_TEMP/describe.err"; then
            pnpm exec cdk deploy "$APP_STACK" -c env=prod --exclusively --require-approval never \
              --progress events --no-notices
          else
            cat "$RUNNER_TEMP/describe.err" >&2
            exit 1
          fi

      # ECR tags cannot be overwritten, so a re-run skips images this commit already pushed.
      - name: Find images to build
        id: missing
        run: |
          targets=()
          for image in api web migrate; do
            count=$(aws ecr batch-get-image --repository-name "firmivra-prod-$image" \
              --image-ids imageTag="$TAG" --query 'length(images)' --output text)
            if [ "$count" = 0 ]; then targets+=("$image"); fi
          done
          echo "Images to build: ${targets[*]:-none}"
          echo "any=$([ ${#targets[@]} -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "targets=$(IFS=,; echo "${targets[*]}")" >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        if: steps.missing.outputs.any == 'true'
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.missing.outputs.any == 'true'

      # The missing images build in parallel in this one step (deploy-prod.docker-bake.hcl).
      - name: Build and push images
        if: steps.missing.outputs.any == 'true'
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: .github/workflows/deploy-prod.docker-bake.hcl
          targets: ${{ steps.missing.outputs.targets }}
          push: true
          provenance: false
          sbom: false
          vars: |
            CONTEXT=${{ github.workspace }}
            REGISTRY=${{ env.REGISTRY }}
            TAG=${{ env.TAG }}

      # A fresh one-hour session for the deploy steps, after the image builds.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: deploy-prod-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # Template changes in the commit go live with this deploy; the diff stays in the log.
      - name: Show app stack changes
        working-directory: infra
        run: pnpm exec cdk diff "$APP_STACK" -c env=prod --exclusively --no-notices

      - name: Deploy the migration image
        working-directory: infra
        run: |
          pnpm exec cdk deploy "$APP_STACK" -c env=prod --exclusively --require-approval never \
            --progress events --no-notices --parameters "$APP_STACK:MigrateImageTag=$TAG"

      - name: Wait for the database
        run: |
          aws rds wait db-instance-available --db-instance-identifier "$DB_INSTANCE"
          echo "Database: available"

      # Migrations run here, once per deploy, never in the api or web tasks.
      - name: Run the migration task
        run: |
          outputs=$(aws cloudformation describe-stacks --stack-name "$APP_STACK" --query 'Stacks[0].Outputs' --output json)
          out() { jq -r --arg k "$1" '.[] | select(.OutputKey == $k) | .OutputValue' <<< "$outputs"; }
          cluster=$(out ClusterName)
          task=$(aws ecs run-task --cluster "$cluster" --task-definition "$(out MigrateTaskDefinition)" \
            --capacity-provider-strategy capacityProvider=FARGATE,weight=1 \
            --network-configuration "awsvpcConfiguration={subnets=[$(out TaskSubnets)],securityGroups=[$(out MigrateSecurityGroup)],assignPublicIp=ENABLED}" \
            --started-by "deploy-prod-$GITHUB_RUN_ID" --query 'tasks[0].taskArn' --output text)
          if [[ "$task" != arn:* ]]; then echo "::error::The migration task did not start"; exit 1; fi
          echo "Migration task: $task"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task"
          result=$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task" --output json)
          code=$(jq -r '.tasks[0].containers[0].exitCode' <<< "$result")
          aws logs get-log-events --log-group-name "$(out MigrateLogGroup)" \
            --log-stream-name "migrate/migrate/${task##*/}" --start-from-head \
            --query 'events[].message' --output text || true
          if [ "$code" != 0 ]; then
            echo "::error::Migration failed (exit $code): $(jq -r '.tasks[0].stoppedReason' <<< "$result")"
            exit 1
          fi

      # With an image, Application Auto Scaling keeps 2 to 6 tasks per service (infra config);
      # the rollout replaces them with the new images.
      - name: Roll out api and web
        working-directory: infra
        run: |
          pnpm exec cdk deploy "$APP_STACK" -c env=prod --exclusively --require-approval never \
            --progress events --no-notices --parameters "$APP_STACK:ImageTag=$TAG"

      # The site URLs come from the stack outputs (infra config), not from this file. The portal is
      # checked at its root, which needs no firm, so the first deploy passes before LVP exists.
      - name: Smoke test the three sites
        run: |
          outputs=$(aws cloudformation describe-stacks --stack-name "$APP_STACK" --query 'Stacks[0].Outputs' --output json)
          out() { jq -r --arg k "$1" '.[] | select(.OutputKey == $k) | .OutputValue' <<< "$outputs"; }
          admin=$(out AdminUrl) app=$(out AppUrl) portal=$(out PortalUrl)
          failed=0
          curl --version | sed -n 1p
          for url in "$admin/" "$app/" "$portal/" \
            "$admin/api/v1/health" "$app/api/v1/health" "$portal/api/v1/health"; do
            # curl's exit code and its own error lines go in the log, so an empty code is explained.
            rc=0
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 20 --retry 6 --retry-delay 10 \
              "$url" 2>"$RUNNER_TEMP/curl.err") || rc=$?
            echo "${code:-none} $url (curl exit $rc)"
            if [ -s "$RUNNER_TEMP/curl.err" ]; then sed 's/^/    /' "$RUNNER_TEMP/curl.err"; fi
            [ "$code" = 200 ] || failed=1
          done
          { echo "Deployed $LABEL (\`$TAG\`) to prod"; echo; echo "- $admin"; echo "- $app"; echo "- $portal"; } >> "$GITHUB_STEP_SUMMARY"
          exit $failed

  # Hold: api and web to 0 tasks through the stack (ImageTag "none"), then the database stopped.
  # Deletes nothing. The next deploy run resumes.
  hold:
    needs: plan
    if: needs.plan.outputs.go == 'true' && needs.plan.outputs.action == 'hold'
    runs-on: ubuntu-24.04
    environment: prod
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @firmivra/infra...

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: hold-prod-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # MigrateImageTag keeps its value (cdk deploy keeps the parameters it is not given), and
      # CloudFormation waits until both services have drained to 0.
      - name: Take api and web to 0 tasks
        working-directory: infra
        run: |
          pnpm exec cdk deploy "$APP_STACK" -c env=prod --exclusively --require-approval never \
            --progress events --no-notices --parameters "$APP_STACK:ImageTag=none"

      - name: Stop the database
        run: |
          status=$(aws rds describe-db-instances --db-instance-identifier "$DB_INSTANCE" \
            --query 'DBInstances[0].DBInstanceStatus' --output text)
          echo "Database: $status"
          if [ "$status" = available ]; then
            aws rds stop-db-instance --db-instance-identifier "$DB_INSTANCE" \
              --query 'DBInstance.DBInstanceStatus' --output text
          fi
          {
            echo "Prod is on hold: api and web at 0 tasks; the database was $status and is stopping."
            echo "Resume: Run workflow with action deploy (ref main)."
          } >> "$GITHUB_STEP_SUMMARY"
